  <title>别碰那只鸡 · Don't Touch the Chick</title>
  <style>
/* ═══════════════════════════════════════════════════════════════
   别碰那只鸡 — visual system
   ═══════════════════════════════════════════════════════════════ */

:root {
  --ink: #0a0f0b;
  --ink-2: #111a12;
  --ink-3: #1b281c;
  --paper: #f4e8c8;
  --paper-dim: #cdbf9e;
  --cream: #fff4d4;
  --gold: #e8b85b;
  --gold-hi: #ffe4a0;
  --gold-dim: #8c6a32;
  --moss: #8eae62;
  --moss-dim: #4e6b3d;
  --blood: #c44536;
  --blood-hi: #f0745e;
  --violet: #8f6aa8;
  --line: rgba(232, 184, 91, 0.28);
  --serif: "KaiTi", "STKaiti", "Songti SC", "STSong", "SimSun", serif;
  --sans: "Microsoft YaHei UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --shadow: 0 1.8cqw 5cqw rgba(0, 0, 0, 0.55);
}

* { box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  background: #070b08;
  color: var(--paper);
  font-family: var(--sans);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body {
  background:
    radial-gradient(ellipse at 50% 55%, #182318 0%, #0a0f0b 48%, #050806 100%);
}

button {
  font: inherit;
  color: inherit;
  border: 0;
  background: none;
  cursor: pointer;
}

button:focus-visible {
  outline: 0.14cqw solid var(--gold-hi);
  outline-offset: 0.24cqw;
}

::selection { background: rgba(232, 184, 91, 0.3); }

#app {
  width: 100%;
  height: 100dvh;
  display: grid;
  place-items: center;
  padding: 0;
}

.stage {
  position: relative;
  width: min(100vw, calc(100dvh * 16 / 9));
  height: min(100dvh, calc(100vw * 9 / 16));
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background: #0b120c;
  container-type: size;
  box-shadow: 0 0 10vmax rgba(0, 0, 0, 0.75);
  isolation: isolate;
}

#scene {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  cursor: none;
  touch-action: none;
}

.grade {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 67% 28%, rgba(255, 221, 142, 0.10), transparent 42%),
    linear-gradient(180deg, rgba(7, 20, 12, 0.08), rgba(6, 11, 7, 0.34));
  mix-blend-mode: soft-light;
  z-index: 3;
}

.grain {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0.17;
  z-index: 4;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.88' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.52'/></svg>");
  mix-blend-mode: overlay;
}

.vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 5;
  background:
    radial-gradient(ellipse at 50% 48%, transparent 46%, rgba(3, 7, 4, 0.28) 76%, rgba(2, 5, 3, 0.72) 100%),
    linear-gradient(90deg, rgba(2, 6, 3, 0.24), transparent 18%, transparent 82%, rgba(2, 6, 3, 0.3));
}

/* ── generic ─────────────────────────────────────────────────── */

.is-hidden {
  opacity: 0 !important;
  visibility: hidden !important;
  pointer-events: none !important;
}

.screen {
  position: absolute;
  inset: 0;
  z-index: 30;
  opacity: 1;
  visibility: visible;
  transition: opacity 0.8s ease, visibility 0.8s;
}

.eyebrow {
  display: flex;
  align-items: center;
  gap: 1.05cqw;
  font-size: 0.78cqw;
  letter-spacing: 0.38em;
  color: var(--gold);
  text-transform: uppercase;
  white-space: nowrap;
}

.eyebrow i {
  display: block;
  width: 2.4cqw;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold-dim));
}

.eyebrow i:last-child {
  background: linear-gradient(90deg, var(--gold-dim), transparent);
}

.primary, .ghost, .danger-btn {

  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.8cqw;
  min-height: 3.3cqw;

  letter-spacing: 0.12em;
  font-size: 0.98cqw;
  transition: transform 0.18s ease, background 0.18s ease, color 0.18s ease, border-color 0.18s ease;

}

.primary {

    linear-gradient(180deg, rgba(232, 184, 91, 0.22), rgba(140, 106, 50, 0.16)),
    rgba(21, 31, 20, 0.76);

}

.primary::after, .start-btn::after {
  content: "";
  position: absolute;
  top: -60%;
  left: -40%;
  width: 28%;
  height: 240%;
  background: linear-gradient(90deg, transparent, rgba(255, 244, 212, 0.24), transparent);
  transform: rotate(22deg) translateX(-130%);
  transition: transform 0.65s ease;
}

.primary:hover::after, .start-btn:hover::after { transform: rotate(22deg) translateX(600%); }

.primary:hover, .danger-btn:hover {
  transform: translateY(-0.12cqw);
  background-color: rgba(232, 184, 91, 0.15);
  border-color: var(--gold-hi);
}

.ghost {
  color: var(--paper-dim);
  border-color: rgba(244, 232, 200, 0.22);
  background: rgba(8, 13, 9, 0.38);
}

.ghost:hover {
  color: var(--paper);
  border-color: rgba(244, 232, 200, 0.52);
  background: rgba(244, 232, 200, 0.07);
}

.danger-btn {
  border-color: rgba(196, 69, 54, 0.7);
  color: #ffb2a4;
  background: rgba(80, 21, 16, 0.4);
}

.danger-btn:hover {
  border-color: var(--blood-hi);
  background: rgba(128, 32, 24, 0.46);
}

.text-btn {
  padding: 0.25cqw 0;
  color: var(--gold);
  font-size: 0.82cqw;
  letter-spacing: 0.12em;
  border-bottom: 1px solid rgba(232, 184, 91, 0.3);
  transition: color 0.2s, border-color 0.2s;
}

.text-btn:hover { color: var(--gold-hi); border-color: var(--gold-hi); }
.text-btn.danger { color: rgba(240, 116, 94, 0.72); border-color: rgba(240, 116, 94, 0.24); }
.text-btn.danger:hover { color: var(--blood-hi); border-color: var(--blood-hi); }

/* ── title ───────────────────────────────────────────────────── */

.title-screen {

.start-btn {

.start-btn svg {

.start-btn:hover {
  transform: translateY(-0.16cqw);
  background-color: rgba(232, 184, 91, 0.14);
  box-shadow: 0 0 2.8cqw rgba(232, 184, 91, 0.12);
}

.start-btn:hover svg { transform: translateX(0.38cqw); }

.title-foot {
  display: flex;
  align-items: center;
  gap: 1.9cqw;
  margin-top: 2.4cqw;
  font-size: 0.78cqw;
  letter-spacing: 0.12em;

}

.title-foot b { color: var(--gold); font-weight: 400; }

.content-note {
  margin-top: 1.2cqw;
  font-size: 0.63cqw;
  letter-spacing: 0.18em;
  color: rgba(205, 191, 158, 0.36);
}

.title-credit {
  position: absolute;
  right: 3.4%;
  bottom: 4.4%;
  z-index: 2;
  writing-mode: vertical-rl;
  font-size: 0.56cqw;
  letter-spacing: 0.52em;
  color: rgba(232, 184, 91, 0.36);
}

/* ── HUD ─────────────────────────────────────────────────────── */

.hud {
  position: absolute;
  inset: 0;
  z-index: 15;
  pointer-events: none;
  opacity: 1;
  transition: opacity 0.55s ease;
}

.hud.is-hidden { display: none; }

.hud button, .hud .feed-btn { pointer-events: auto; }

.hud-top {
  position: absolute;
  top: 2.15cqw;
  left: 2.6cqw;
  right: 2.6cqw;

  align-items: flex-start;

}

.brand {

  align-items: center;
  gap: 0.85cqw;
  padding-top: 0.35cqw;
}

.brand-seal {
  display: grid;
  place-items: center;
  width: 2.7cqw;
  height: 2.7cqw;
  border: 1px solid rgba(232, 184, 91, 0.5);
  color: var(--gold);
  font-family: var(--serif);
  font-size: 1.25cqw;
  line-height: 1;
  background: rgba(10, 17, 11, 0.5);
  box-shadow: inset 0 0 0 0.24cqw rgba(10, 17, 11, 0.35);

}

.brand-copy { display: flex; flex-direction: column; gap: 0.18cqw; }

.brand-copy b {
  font-family: var(--serif);

  letter-spacing: 0.24em;

}

.brand-copy small {

  color: rgba(232, 184, 91, 0.62);
}

.weight-card {

  margin-left: auto;
  padding: 0.75cqw 0.95cqw 0.7cqw;

}

.weight-head {

}

.weight-value { display: flex; align-items: baseline; gap: 0.25cqw; }
.weight-value b { font-family: var(--serif); font-size: 1.3cqw; font-weight: 400; color: var(--gold-hi); letter-spacing: 0.02em; }
.weight-value small { font-size: 0.52cqw; color: rgba(244, 232, 200, 0.4); letter-spacing: 0; }

.weight-track {

.weight-track i {
  display: block;

  transition: width 0.55s cubic-bezier(0.22, 0.85, 0.3, 1);
  box-shadow: 0 0 0.8cqw rgba(232, 184, 91, 0.5);
}

.weight-track .weight-tick {
  position: absolute;
  top: 0;
  width: 1px;
  height: 100%;
  background: rgba(244, 232, 200, 0.36);
}

.weight-foot {
  display: flex;
  justify-content: space-between;
  gap: 0.5cqw;
  font-size: 0.57cqw;
  letter-spacing: 0.1em;
  color: rgba(244, 232, 200, 0.56);
}

.weight-foot span:first-child { color: var(--moss); }
.weight-card.warn .weight-foot span:first-child { color: var(--gold-hi); }

.weight-card.danger .weight-track i { background: linear-gradient(90deg, #b85a45, #f0745e); }

.top-actions {

  gap: 0.55cqw;

}

.icon-btn {

.icon-btn:hover {

}

.icon-btn svg {
  width: 1.1cqw;
  height: 1.1cqw;
  fill: none;
  stroke: currentColor;

  stroke-linejoin: round;

.icon-btn .ico-sound path:first-child,
.icon-btn .ico-mute path:first-child { fill: currentColor; stroke: none; }

.icon-btn.is-muted .ico-sound { display: none; }

.objective {

  left: 2.7cqw;
  display: flex;
  align-items: center;

  padding: 0.55cqw 0.9cqw;

.fate-btn:hover { transform: translateY(-0.2cqw); background-color: rgba(232, 184, 91, 0.06); }

@keyframes fateGlow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(232, 184, 91, 0.16), 0 0.8cqw 2.8cqw rgba(0, 0, 0, 0.34); }
  50% { box-shadow: 0 0 0 0.45cqw rgba(232, 184, 91, 0.04), 0 0.8cqw 2.8cqw rgba(0, 0, 0, 0.34); }
}

.fate-ring {
  position: relative;
  width: 1.8cqw;
  height: 1.8cqw;
  flex: 0 0 auto;
  border: 1px solid rgba(232, 184, 91, 0.52);
  border-radius: 50%;
}

.fate-ring::before, .fate-ring::after {
  content: "";
  position: absolute;
  inset: 0.38cqw;
  border: 1px solid rgba(232, 184, 91, 0.72);
  border-radius: 50%;
}

.fate-ring::after {
  inset: 0.72cqw;
  background: var(--gold);
  border: 0;
  box-shadow: 0 0 0.65cqw rgba(232, 184, 91, 0.7);
}

.fate-copy { display: flex; flex-direction: column; gap: 0.06cqw; }
.fate-copy small { font-size: 0.48cqw; letter-spacing: 0.16em; color: rgba(244, 232, 200, 0.45); }
.fate-copy b { font-family: var(--serif); font-weight: 400; font-size: 0.88cqw; letter-spacing: 0.14em; color: var(--gold-hi); }
.fate-arrow { margin-left: auto; color: var(--gold); font-size: 1.2cqw; }

.dialogue {
  position: absolute;
  left: 50%;
  bottom: 7.1cqw;
  transform: translateX(-50%);
  width: min(48cqw, 58%);
  display: flex;
  align-items: flex-start;
  gap: 0.8cqw;
  padding: 0.72cqw 1.05cqw;
  background: linear-gradient(180deg, rgba(6, 11, 7, 0.78), rgba(6, 11, 7, 0.58));
  border-top: 1px solid rgba(232, 184, 91, 0.2);
  border-bottom: 1px solid rgba(232, 184, 91, 0.1);
  backdrop-filter: blur(7px);
  pointer-events: none;
  transition: opacity 0.4s, transform 0.4s;
}

.dialogue.is-hidden { display: none; }

.speaker {
  flex: 0 0 auto;
  padding: 0.12cqw 0.45cqw;
  border: 1px solid rgba(232, 184, 91, 0.4);
  font-family: var(--serif);
  font-size: 0.62cqw;
  letter-spacing: 0.12em;
  color: var(--gold);
}

.dialogue p {
  margin: 0.1cqw 0 0;
  font-family: var(--serif);
  font-size: 0.86cqw;
  line-height: 1.65;
  letter-spacing: 0.08em;
  color: rgba(244, 232, 200, 0.86);
}

.toast {
  position: absolute;
  left: 50%;
  bottom: 11.2cqw;
  transform: translate(-50%, 0.6cqw);
  padding: 0.45cqw 1cqw;
  background: rgba(6, 12, 7, 0.8);
  border: 1px solid rgba(232, 184, 91, 0.26);
  font-size: 0.68cqw;
  letter-spacing: 0.12em;
  color: var(--paper);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.28s, transform 0.28s;
  white-space: nowrap;
  z-index: 5;
}

.toast.show { opacity: 1; transform: translate(-50%, 0); }

.cursor-hint {
  position: absolute;
  left: 0;
  top: 0;
  z-index: 18;
  padding: 0.22cqw 0.45cqw;
  font-size: 0.58cqw;
  letter-spacing: 0.1em;
  color: #ffd0c6;
  background: rgba(42, 10, 8, 0.8);
  border: 1px solid rgba(240, 116, 94, 0.35);
  transform: translate(1.3cqw, 1.1cqw);
  opacity: 0;
  transition: opacity 0.18s;
  pointer-events: none;
  white-space: nowrap;
}

.cursor-hint.show { opacity: 1; }

/* ── modal ───────────────────────────────────────────────────── */

.modal-layer {
  position: absolute;
  inset: 0;
  z-index: 60;
  display: grid;
  place-items: center;
  opacity: 1;
  visibility: visible;
  transition: opacity 0.35s ease, visibility 0.35s;
}

.modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(3, 7, 4, 0.64);
  backdrop-filter: blur(4px) saturate(0.8);
}

.modal-card {
  position: relative;
  width: min(58cqw, 74%);
  max-height: 88cqh;
  overflow: auto;
  padding: 2.55cqw 3cqw 2.4cqw;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(232, 184, 91, 0.08), transparent 36%),
    linear-gradient(180deg, rgba(17, 27, 18, 0.98), rgba(8, 14, 9, 0.99));
  border: 1px solid rgba(232, 184, 91, 0.36);
  box-shadow: 0 1.4cqw 5cqw rgba(0, 0, 0, 0.55), inset 0 0 0 0.48cqw rgba(232, 184, 91, 0.025);
  transform: translateY(0);
  animation: modalIn 0.42s cubic-bezier(0.22, 0.9, 0.28, 1);
}

.modal-card::before, .modal-card::after {
  content: "";
  position: absolute;
  width: 1.2cqw;
  height: 1.2cqw;
  pointer-events: none;
}

.modal-card::before {
  top: 0.5cqw;
  left: 0.5cqw;
  border-top: 1px solid var(--gold);
  border-left: 1px solid var(--gold);
}

.modal-card::after {
  bottom: 0.5cqw;
  right: 0.5cqw;
  border-bottom: 1px solid var(--gold);
  border-right: 1px solid var(--gold);
}

@keyframes modalIn {
  from { opacity: 0; transform: translateY(1.2cqw) scale(0.985); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.modal-card::-webkit-scrollbar { width: 0.3cqw; }
.modal-card::-webkit-scrollbar-thumb { background: rgba(232, 184, 91, 0.3); }

.modal-close {
  position: absolute;
  top: 1cqw;
  right: 1.3cqw;
  width: 2cqw;
  height: 2cqw;
  color: rgba(244, 232, 200, 0.46);
  font-size: 1.35cqw;
  line-height: 1;
  transition: color 0.2s, transform 0.2s;
}

.modal-close:hover { color: var(--gold-hi); transform: rotate(90deg); }

.modal-kicker {
  font-size: 0.6cqw;
  letter-spacing: 0.32em;
  color: rgba(232, 184, 91, 0.7);
  text-transform: uppercase;
  margin-bottom: 0.75cqw;
}

.modal-card h2 {
  margin: 0;
  font-family: var(--serif);
  font-size: 2.6cqw;
  font-weight: 400;
  letter-spacing: 0.1em;
  line-height: 1.25;
  color: var(--paper);
}

.modal-body {
  margin-top: 1.2cqw;
  font-family: var(--serif);
  font-size: 0.94cqw;
  line-height: 1.9;
  letter-spacing: 0.06em;
  color: rgba(244, 232, 200, 0.72);
}

.modal-body p { margin: 0 0 0.75cqw; }
.modal-body p:last-child { margin-bottom: 0; }
.modal-body em { color: var(--gold); font-style: normal; }
.modal-body strong { color: #ffb2a4; font-weight: 400; }

.modal-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75cqw;
  margin-top: 2.05cqw;
  padding-top: 1.45cqw;
  border-top: 1px solid rgba(232, 184, 91, 0.13);
}

.modal-actions .primary,
.modal-actions .ghost,
.modal-actions .danger-btn { flex: 1 1 auto; }

.modal-actions.stacked { flex-direction: column; }
.modal-actions.stacked > button { width: 100%; justify-content: space-between; padding-left: 1.4cqw; padding-right: 1.4cqw; }
.modal-actions.stacked > button .choice-note { font-family: var(--sans); font-size: 0.62cqw; letter-spacing: 0.08em; color: rgba(244, 232, 200, 0.4); }

/* creature picker */
.choice-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0.85cqw;
  margin-top: 1.5cqw;
}

.creature-card {
  position: relative;
  display: grid;
  grid-template-columns: 7.4cqw 1fr;
  gap: 0.7cqw;
  align-items: center;
  padding: 0.65cqw;
  border: 1px solid rgba(244, 232, 200, 0.12);
  background: rgba(244, 232, 200, 0.025);
  text-align: left;
  transition: border-color 0.2s, background 0.2s, transform 0.2s;
}

.creature-card:hover {
  border-color: rgba(232, 184, 91, 0.55);
  background: rgba(232, 184, 91, 0.06);
  transform: translateY(-0.15cqw);
}

.creature-card canvas {
  width: 7.4cqw;
  height: 6.2cqw;
  display: block;
  background: radial-gradient(ellipse at 50% 42%, rgba(232, 184, 91, 0.08), transparent 68%);
}

.creature-meta { display: flex; flex-direction: column; gap: 0.18cqw; }
.creature-meta b { font-family: var(--serif); font-weight: 400; font-size: 1.02cqw; letter-spacing: 0.12em; color: var(--paper); }
.creature-meta small { font-family: var(--sans); font-size: 0.56cqw; line-height: 1.55; letter-spacing: 0.03em; color: rgba(244, 232, 200, 0.42); }
.creature-meta i { font-style: normal; font-size: 0.5cqw; letter-spacing: 0.16em; color: rgba(232, 184, 91, 0.58); }

.creature-card.danger:hover { border-color: rgba(240, 116, 94, 0.5); background: rgba(128, 32, 24, 0.12); }
.creature-card.danger .creature-meta i { color: rgba(240, 116, 94, 0.74); }

/* hybrid result */
.result-stage {
  display: grid;
  grid-template-columns: 1.18fr 0.82fr;
  gap: 1.4cqw;
  align-items: center;
  margin-top: 0.7cqw;
}

.result-portrait {
  position: relative;
  background: radial-gradient(ellipse at 50% 42%, rgba(232, 184, 91, 0.09), transparent 68%);
  border: 1px solid rgba(244, 232, 200, 0.1);
}

.result-portrait canvas { display: block; width: 100%; height: auto; }

.result-portrait .scan-label {
  position: absolute;
  left: 0.7cqw;
  top: 0.55cqw;
  font-family: var(--sans);
  font-size: 0.48cqw;
  letter-spacing: 0.2em;
  color: rgba(232, 184, 91, 0.55);
}

.result-copy { font-family: var(--sans); }
.result-name { display: flex; flex-direction: column; align-items: flex-start; gap: 0.12cqw; margin-bottom: 0.75cqw; }
.result-name b { font-family: var(--serif); font-size: 1.75cqw; font-weight: 400; line-height: 1.15; color: var(--gold-hi); letter-spacing: 0.08em; }
.result-name small { font-size: 0.52cqw; letter-spacing: 0.18em; color: rgba(244, 232, 200, 0.38); }

.stat-row {
  display: grid;
  grid-template-columns: 3.3cqw 1fr 2.2cqw;
  align-items: center;
  gap: 0.45cqw;
  margin: 0.45cqw 0;
  font-size: 0.52cqw;
  letter-spacing: 0.12em;
  color: rgba(244, 232, 200, 0.5);
}

.stat-track { height: 0.26cqw; background: rgba(244, 232, 200, 0.1); overflow: hidden; }
.stat-track i { display: block; height: 100%; background: var(--moss); transition: width 1s cubic-bezier(0.2, 0.8, 0.2, 1); }
.stat-track.ugly i { background: linear-gradient(90deg, #846070, var(--blood)); }
.stat-row span:last-child { text-align: right; color: rgba(244, 232, 200, 0.7); }

.result-desc {
  margin-top: 0.9cqw;
  padding-top: 0.8cqw;
  border-top: 1px solid rgba(232, 184, 91, 0.12);
  font-family: var(--serif);
  font-size: 0.82cqw;
  line-height: 1.75;
  color: rgba(244, 232, 200, 0.62);
}

.result-warning {
  margin-top: 0.8cqw;
  padding: 0.6cqw 0.8cqw;
  border-left: 2px solid var(--blood);
  background: rgba(128, 32, 24, 0.14);
  font-family: var(--serif);
  font-size: 0.74cqw;
  line-height: 1.7;
  color: #ffb8aa;
}

/* loli scene */
.loli-card { width: min(64cqw, 82%); }

.loli-stage {
  display: grid;
  grid-template-columns: 1.08fr 0.92fr;
  gap: 1.8cqw;
  align-items: center;
  margin-top: 0.2cqw;
}

.loli-art {
  position: relative;
  overflow: hidden;
  border: 1px solid rgba(232, 184, 91, 0.22);
  background:
    radial-gradient(ellipse at 50% 38%, rgba(255, 232, 178, 0.12), transparent 62%),
    linear-gradient(180deg, rgba(41, 55, 38, 0.55), rgba(12, 20, 13, 0.5));
}

.loli-art canvas { display: block; width: 100%; height: auto; }

.loli-art::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 50% 40%, transparent 48%, rgba(3, 7, 4, 0.45));
  pointer-events: none;
}

.loli-copy { font-family: var(--serif); }
.loli-copy .loli-name { margin: 0 0 0.65cqw; font-size: 1.65cqw; font-weight: 400; color: var(--gold-hi); letter-spacing: 0.12em; }
.loli-copy .loli-line { margin: 0 0 1cqw; font-size: 0.94cqw; line-height: 1.85; color: rgba(244, 232, 200, 0.72); letter-spacing: 0.05em; }
.loli-copy .loli-line em { color: #ffd9a0; font-style: normal; }
.loli-prompt {
  padding: 0.7cqw 0;
  border-top: 1px solid rgba(232, 184, 91, 0.16);
  border-bottom: 1px solid rgba(232, 184, 91, 0.16);
  font-size: 0.68cqw;
  letter-spacing: 0.1em;
  color: rgba(232, 184, 91, 0.72);
}

.loli-choices {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.8cqw;
  margin-top: 1.65cqw;
}

.loli-choice {
  position: relative;
  min-height: 5.2cqw;
  padding: 0.8cqw;
  border: 1px solid rgba(244, 232, 200, 0.16);
  background: rgba(244, 232, 200, 0.028);
  text-align: left;
  transition: border-color 0.2s, background 0.2s, transform 0.2s;
}

.loli-choice:hover {
  border-color: rgba(232, 184, 91, 0.62);
  background: rgba(232, 184, 91, 0.07);
  transform: translateY(-0.16cqw);
}

.loli-choice b { display: block; font-family: var(--serif); font-size: 1.05cqw; font-weight: 400; letter-spacing: 0.16em; color: var(--paper); }
.loli-choice small { display: block; margin-top: 0.25cqw; font-family: var(--sans); font-size: 0.52cqw; letter-spacing: 0.06em; color: rgba(244, 232, 200, 0.38); }
.loli-choice .num { position: absolute; top: 0.4cqw; right: 0.55cqw; font-size: 0.46cqw; color: rgba(232, 184, 91, 0.4); letter-spacing: 0.1em; }

/* ── cinematic ───────────────────────────────────────────────── */

.cinematic {
  position: absolute;
  inset: 0;
  z-index: 70;
  display: grid;
  place-items: center;
  background:
    radial-gradient(ellipse at 50% 44%, rgba(9, 16, 10, 0.62), rgba(2, 5, 3, 0.94) 72%),
    rgba(2, 5, 3, 0.85);
  backdrop-filter: blur(3px);
  transition: opacity 0.45s ease, visibility 0.45s;
}

.cine-inner {
  width: min(54cqw, 72%);
  text-align: center;
}

.cine-lines {
  font-family: var(--serif);
  font-size: 1.35cqw;
  line-height: 2.1;
  letter-spacing: 0.08em;
  color: rgba(244, 232, 200, 0.84);
  text-shadow: 0 0.2cqw 1.6cqw rgba(0, 0, 0, 0.7);
}

.cine-lines p {
  margin: 0.55cqw 0;
  opacity: 0;
  transform: translateY(0.5cqw);
  animation: lineIn 0.9s cubic-bezier(0.22, 0.85, 0.3, 1) forwards;
}

.cine-lines p.dark { color: #ff9f90; }
.cine-lines p.gold { color: var(--gold-hi); }
.cine-lines p.small { font-size: 0.9cqw; color: rgba(244, 232, 200, 0.46); letter-spacing: 0.16em; }

@keyframes lineIn {
  to { opacity: 1; transform: translateY(0); }
}

.cine-next {
  margin-top: 2.1cqw;
  padding: 0.7cqw 1.8cqw;
  border: 1px solid rgba(232, 184, 91, 0.42);
  color: var(--gold);
  font-size: 0.76cqw;
  letter-spacing: 0.3em;
  background: rgba(232, 184, 91, 0.04);
  opacity: 0;
  animation: lineIn 0.8s 0.5s forwards;
  transition: background 0.2s, color 0.2s;
}

.cine-next:hover { background: rgba(232, 184, 91, 0.12); color: var(--gold-hi); }

/* ── ending ──────────────────────────────────────────────────── */

.ending-screen {
  z-index: 80;
  display: grid;
  grid-template-columns: 1.16fr 0.84fr;
  background:
    radial-gradient(ellipse at 28% 44%, rgba(28, 38, 26, 0.7), transparent 72%),
    linear-gradient(110deg, #070c08 0%, #0b120c 60%, #070b08 100%);
  opacity: 1;
  transition: opacity 0.8s ease;
}

.ending-art-wrap {
  position: relative;
  display: grid;
  place-items: center;
  overflow: hidden;
  border-right: 1px solid rgba(232, 184, 91, 0.15);
}

.ending-art-wrap::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(90deg, rgba(6, 11, 7, 0.4), transparent 24%, transparent 76%, rgba(6, 11, 7, 0.72)),
    linear-gradient(0deg, rgba(6, 11, 7, 0.72), transparent 28%, transparent 72%, rgba(6, 11, 7, 0.4));
  z-index: 1;
  pointer-events: none;
}

#endingArt {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.92;
}

.ending-panel {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 4.4cqw 5.2cqw;
  animation: endingIn 1s 0.25s both;
}

@keyframes endingIn {
  from { opacity: 0; transform: translateY(1cqw); }
  to { opacity: 1; transform: translateY(0); }
}

.ending-kicker {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 0.8cqw;
  border-bottom: 1px solid rgba(232, 184, 91, 0.22);
  font-size: 0.6cqw;
  letter-spacing: 0.22em;
  color: rgba(232, 184, 91, 0.74);
}

.ending-kicker span:last-child { color: rgba(240, 116, 94, 0.8); }
.ending-kicker span:last-child.good { color: var(--gold-hi); }

.ending-panel h2 {
  margin: 1.6cqw 0 0;
  font-family: var(--serif);
  font-size: 3.4cqw;
  font-weight: 400;
  line-height: 1.05;
  letter-spacing: 0.08em;
  color: var(--paper);
}

.ending-panel p {
  margin: 1.3cqw 0 0;
  font-family: var(--serif);
  font-size: 1.02cqw;
  line-height: 1.95;
  letter-spacing: 0.05em;
  color: rgba(244, 232, 200, 0.62);
}

.ending-rule {
  width: 3.6cqw;
  height: 1px;
  margin: 1.7cqw 0;
  background: linear-gradient(90deg, var(--gold), transparent);
}

.ending-actions { display: flex; gap: 0.75cqw; }
.ending-actions .primary { flex: 1; }
.ending-actions .ghost { flex: 0 0 auto; }

.ending-tip {
  margin-top: 1.25cqw;
  font-size: 0.55cqw;
  letter-spacing: 0.12em;
  color: rgba(244, 232, 200, 0.28);
}

.ending-screen.good .ending-kicker span:last-child { color: var(--gold-hi); }
.ending-screen.good .ending-panel h2 {
  background: linear-gradient(180deg, #fff4d0, #e8b85b);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.ending-screen.good .ending-art-wrap { border-right-color: rgba(232, 184, 91, 0.3); }

.ending-screen.true-end .ending-art-wrap::after {
  content: "";
  position: absolute;
  inset: 0;
  box-shadow: inset 0 0 8cqw rgba(232, 184, 91, 0.16);
  pointer-events: none;
  z-index: 2;
}

/* ── archive ─────────────────────────────────────────────────── */

.archive-screen {
  z-index: 90;
  display: grid;
  place-items: center;
  background:
    radial-gradient(ellipse at 50% 22%, rgba(42, 54, 34, 0.55), transparent 60%),
    rgba(4, 8, 5, 0.96);
  backdrop-filter: blur(8px);
}

.archive-inner {
  width: min(76cqw, 88%);
  max-height: 88cqh;
  display: flex;
  flex-direction: column;
  padding: 2.2cqw 2.6cqw;
  border: 1px solid rgba(232, 184, 91, 0.28);
  background: linear-gradient(180deg, rgba(17, 26, 17, 0.9), rgba(8, 13, 9, 0.92));
}

.archive-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 2cqw;
  padding-bottom: 1.2cqw;
  border-bottom: 1px solid rgba(232, 184, 91, 0.16);
}

.archive-head .eyebrow { font-size: 0.54cqw; }
.archive-head h2 {
  margin: 0.45cqw 0 0;
  font-family: var(--serif);
  font-weight: 400;
  font-size: 2.35cqw;
  letter-spacing: 0.16em;
  color: var(--paper);
}

.archive-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.75cqw;
  margin: 1.3cqw 0;
  overflow: auto;
  padding-right: 0.2cqw;
}

.archive-grid::-webkit-scrollbar { width: 0.3cqw; }
.archive-grid::-webkit-scrollbar-thumb { background: rgba(232, 184, 91, 0.3); }

.archive-item {
  position: relative;
  min-height: 5.8cqw;
  padding: 0.8cqw 0.9cqw;
  border: 1px solid rgba(244, 232, 200, 0.1);
  background: rgba(244, 232, 200, 0.025);
  overflow: hidden;
}

.archive-item .num { font-size: 0.48cqw; letter-spacing: 0.18em; color: rgba(232, 184, 91, 0.46); }
.archive-item h3 { margin: 0.32cqw 0 0.22cqw; font-family: var(--serif); font-size: 1.02cqw; font-weight: 400; letter-spacing: 0.1em; color: var(--paper); }

.archive-item.locked { opacity: 0.5; }

/* ── effects ─────────────────────────────────────────────────── */

.flash {
  position: absolute;
  inset: 0;
  z-index: 100;
  pointer-events: none;
  opacity: 0;
  background: #fff8e6;
}

.flash.red { background: #9e2418; }
.flash.violet { background: #7a4f92; }
.flash.green { background: #78a45d; }

.flash.burst { animation: flashBurst 0.75s ease-out forwards; }

@keyframes flashBurst {
  0% { opacity: 0; }
  8% { opacity: 0.88; }
  100% { opacity: 0; }
}

.fade {
  position: absolute;
  inset: 0;
  z-index: 101;
  pointer-events: none;
  background: #030604;
  opacity: 0;
  transition: opacity 0.7s ease;
}

.fade.on { opacity: 1; }

.vomit-overlay {
  position: absolute;
  inset: 0;
  z-index: 95;
  pointer-events: none;
  opacity: 0;
  background:
    radial-gradient(ellipse at 50% 50%, transparent 16%, rgba(82, 112, 38, 0.42) 70%, rgba(22, 34, 14, 0.8)),
    repeating-linear-gradient(0deg, transparent 0 2.1cqw, rgba(156, 196, 92, 0.05) 2.1cqw 2.2cqw);
  mix-blend-mode: screen;
  transition: opacity 0.4s;
}

.vomit-overlay.on {
  opacity: 1;
  animation: queasy 1.4s linear infinite;
}

@keyframes queasy {
  0%, 100% { transform: translate(0, 0) scale(1.01) rotate(0deg); }
  20% { transform: translate(-0.5cqw, 0.3cqw) scale(1.015) rotate(0.25deg); }
  40% { transform: translate(0.4cqw, -0.25cqw) scale(1.01) rotate(-0.2deg); }
  60% { transform: translate(-0.25cqw, -0.4cqw) scale(1.02) rotate(0.18deg); }
  80% { transform: translate(0.3cqw, 0.35cqw) scale(1.012) rotate(-0.24deg); }
}

.stage.shake { animation: stageShake 0.48s cubic-bezier(0.36, 0.07, 0.19, 0.97); }
.stage.shake-hard { animation: stageShakeHard 0.72s cubic-bezier(0.36, 0.07, 0.19, 0.97); }

@keyframes stageShake {
  10%, 90% { transform: translate3d(-0.14cqw, 0.08cqw, 0); }
  20%, 80% { transform: translate3d(0.28cqw, -0.14cqw, 0); }
  30%, 50%, 70% { transform: translate3d(-0.38cqw, 0.2cqw, 0); }
  40%, 60% { transform: translate3d(0.38cqw, -0.12cqw, 0); }
}

@keyframes stageShakeHard {
  0%, 100% { transform: translate3d(0, 0, 0) rotate(0); }
  10% { transform: translate3d(-0.8cqw, 0.45cqw, 0) rotate(-0.25deg); }

  50% { transform: translate3d(-0.85cqw, 0.5cqw, 0) rotate(-0.22deg); }
  60% { transform: translate3d(0.7cqw, -0.35cqw, 0) rotate(0.2deg); }
  70% { transform: translate3d(-0.45cqw, 0.25cqw, 0) rotate(-0.12deg); }
  80% { transform: translate3d(0.3cqw, -0.18cqw, 0) rotate(0.08deg); }
}

  <script>
/* ═══════════════════════════════════════════════════════════════
   Art — procedural forest, chick, portraits and ending cards
   No external images. Everything is drawn on canvas.
   ═══════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  const W = 1600;
  const H = 900;
  const TAU = Math.PI * 2;
  const CHICK_X = 796;
  const CHICK_Y = 706;
  const CHICK_SCALE = 1.36;

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = (t) => t * t * (3 - 2 * t);

  function mulberry32(a) {
    return function () {
      a |= 0;
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function ell(g, x, y, rx, ry, rot) {
    g.beginPath();
    g.ellipse(x, y, Math.max(0.01, rx), Math.max(0.01, ry), rot || 0, 0, TAU);
  }

  function parse(hex) {
    const h = hex.replace('#', '');
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }

  function rgba(hex, a) {
    const [r, gg, b] = parse(hex);
    return `rgba(${r},${gg},${b},${a})`;
  }

  /* ─────────────────────────────────────────────────────────────
     static forest background
     ───────────────────────────────────────────────────────────── */

  let bgCanvas = null;

  function drawTrunk(g, x, baseY, height, width, dark, light, seed, alpha) {
    const r = mulberry32(seed);
    g.save();
    g.globalAlpha = alpha;
    const topY = baseY - height;
    const grad = g.createLinearGradient(x - width / 2, 0, x + width / 2, 0);
    grad.addColorStop(0, dark);
    grad.addColorStop(0.48, light);
    grad.addColorStop(1, dark);
    g.fillStyle = grad;
    g.beginPath();
    g.moveTo(x - width * 0.58, baseY);
    g.bezierCurveTo(x - width * 0.52, baseY - height * 0.45, x - width * 0.36, topY + height * 0.25, x - width * 0.28, topY);
    g.lineTo(x + width * 0.22, topY);
    g.bezierCurveTo(x + width * 0.44, topY + height * 0.3, x + width * 0.52, baseY - height * 0.42, x + width * 0.62, baseY);
    g.closePath();
    g.fill();

    // bark grooves
    for (let i = 0; i < 22; i++) {
      const bx = x + (r() - 0.5) * width * 0.82;
      const by = topY + r() * height;
      const bh = 20 + r() * 100;
      g.strokeStyle = r() > 0.5 ? 'rgba(10,22,12,0.22)' : 'rgba(156,164,107,0.08)';
      g.lineWidth = 1 + r() * 2.4;
      g.beginPath();
      g.moveTo(bx, by);
      g.bezierCurveTo(bx + 4, by + bh * 0.3, bx - 5, by + bh * 0.7, bx + 2, by + bh);
      g.stroke();
    }

    // moss on one side
    g.fillStyle = 'rgba(85,110,55,0.18)';
    for (let i = 0; i < 12; i++) {
      const my = topY + r() * height;
      ell(g, x - width * 0.25 + r() * 8, my, 2 + r() * 12, 4 + r() * 18, r() * 0.8);
      g.fill();
    }

    // roots
    g.strokeStyle = dark;
    g.lineCap = 'round';
    for (let i = 0; i < 5; i++) {
      const dir = i % 2 ? 1 : -1;
      g.lineWidth = 4 + r() * 10;
      g.beginPath();
      g.moveTo(x + dir * width * 0.25, baseY - 8);
      g.bezierCurveTo(x + dir * width * 0.55, baseY + 8, x + dir * width * 0.82, baseY + 2, x + dir * (width * 0.9 + r() * 100), baseY + 28);
      g.stroke();
    }
    g.restore();
  }

  function drawCanopy(g, cx, cy, size, seed, palette) {
    const r = mulberry32(seed);
    g.save();
    for (let i = 0; i < 38; i++) {
      const a = r() * TAU;
      const d = Math.pow(r(), 0.62) * size;
      const x = cx + Math.cos(a) * d * 1.5;
      const y = cy + Math.sin(a) * d * 0.72;
      const rx = size * (0.09 + r() * 0.18);
      const ry = size * (0.045 + r() * 0.09);
      g.fillStyle = palette[Math.floor(r() * palette.length)];
      ell(g, x, y, rx, ry, r() * 0.9 - 0.45);
      g.fill();
    }
    g.restore();
  }

  function drawBigTree(g, x, baseY, height, width, seed, flip) {
    const r = mulberry32(seed);
    drawTrunk(g, x, baseY, height, width, '#142015', '#3b4b2d', seed, 1);

    // branches
    g.save();
    g.strokeStyle = '#1a291a';
    g.lineCap = 'round';
    for (let i = 0; i < 5; i++) {
      const by = baseY - height * (0.52 + i * 0.09);
      const dir = (i % 2 ? 1 : -1) * (flip ? -1 : 1);
      g.lineWidth = 18 - i * 2.3;
      g.beginPath();
      g.moveTo(x, by);
      g.bezierCurveTo(x + dir * width * 0.9, by - 18, x + dir * width * 1.8, by - 80, x + dir * width * 2.8, by - 130);
      g.stroke();
      g.lineWidth = 6;
      g.beginPath();
      g.moveTo(x + dir * width * 1.3, by - 30);
      g.quadraticCurveTo(x + dir * width * 1.9, by - 85, x + dir * width * 2.3, by - 58);
      g.stroke();
    }
    g.restore();

    // hanging foliage
    const palettes = [
      ['#122217', '#1a2d1d', '#263b22', '#334a27'],
      ['#16261a', '#1f3320', '#2b4124', '#3d562c']
    ];
    drawCanopy(g, x + (flip ? -50 : 40), baseY - height * 0.83, width * 2.4, seed + 3, palettes[0]);
    drawCanopy(g, x + (flip ? -width * 2.1 : width * 2.1), baseY - height * 0.67, width * 1.8, seed + 4, palettes[1]);

    // a few backlit leaf tips
    g.save();
    g.globalCompositeOperation = 'screen';
    for (let i = 0; i < 55; i++) {
      const a = r() * TAU;
      const d = r() * width * 2.4;
      const lx = x + Math.cos(a) * d * (flip ? -1 : 1);
      const ly = baseY - height * 0.73 + Math.sin(a) * d * 0.35;
      g.fillStyle = `rgba(198,180,101,${0.025 + r() * 0.055})`;
      ell(g, lx, ly, 4 + r() * 16, 1.5 + r() * 4, r() * TAU);
      g.fill();
    }
    g.restore();
  }

  function drawBroadLeaf(g, x, y, scale, rot, color, seed) {
    const r = mulberry32(seed);
    g.save();
    g.translate(x, y);
    g.rotate(rot);
    g.scale(scale, scale);
    g.fillStyle = color;
    g.strokeStyle = color;
    g.lineCap = 'round';
    for (let i = 0; i < 6; i++) {
      const a = -1.45 + i * 0.4 + (r() - 0.5) * 0.18;
      const len = 100 + r() * 110;
      const ex = Math.cos(a) * len * 0.72;
      const ey = Math.sin(a) * len;
      g.lineWidth = 2.2;
      g.beginPath();
      g.moveTo(0, 0);
      g.quadraticCurveTo(ex * 0.28, ey * 0.55, ex, ey);
      g.stroke();
      const leafW = len * (0.16 + r() * 0.07);
      g.beginPath();
      g.moveTo(ex * 0.18, ey * 0.18);
      g.bezierCurveTo(ex * 0.25 - leafW, ey * 0.46, ex * 0.78 - leafW, ey * 0.78, ex, ey);
      g.bezierCurveTo(ex * 0.78 + leafW, ey * 0.78, ex * 0.25 + leafW, ey * 0.46, ex * 0.18, ey * 0.18);
      g.fill();
      g.strokeStyle = 'rgba(128,154,86,0.12)';
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(ex * 0.24, ey * 0.24);
      g.quadraticCurveTo(ex * 0.56, ey * 0.62, ex, ey);
      g.stroke();
      g.strokeStyle = color;
    }
    g.restore();
  }

  function drawFern(g, x, y, scale, rot, color, seed) {
    const r = mulberry32(seed);
    g.save();
    g.translate(x, y);
    g.rotate(rot);
    g.scale(scale, scale);
    g.translate(0, -10);
    g.strokeStyle = color;
    g.fillStyle = color;
    g.lineCap = 'round';
    for (let f = 0; f < 7; f++) {
      const a = -1.9 + f * 0.42 + (r() - 0.5) * 0.12;
      const len = 105 + r() * 55;
      const ex = Math.cos(a) * len;
      const ey = Math.sin(a) * len;
      g.lineWidth = 2.1;
      g.beginPath();
      g.moveTo(0, 0);
      g.quadraticCurveTo(ex * 0.42, ey * 0.22, ex, ey);
      g.stroke();
      for (let i = 0; i < 10; i++) {
        const t = 0.16 + i * 0.082;
        const px = ex * t;
        const py = ey * t;
        const leaf = (1 - i / 12) * 17;
        const side = i % 2 ? 1 : -1;
        const tangent = a + 1.32 + side * 0.58;
        const lx = px + Math.cos(tangent) * leaf;
        const ly = py + Math.sin(tangent) * leaf;
        g.globalAlpha = 0.55 + (1 - t) * 0.35;
        g.beginPath();
        g.moveTo(px, py);
        g.quadraticCurveTo(
          px + Math.cos(tangent) * leaf * 0.46 - Math.cos(a) * 4,
          py + Math.sin(tangent) * leaf * 0.46 - Math.sin(a) * 4,
          lx, ly
        );
        g.quadraticCurveTo(
          px + Math.cos(tangent) * leaf * 0.52 + Math.cos(a) * 5,
          py + Math.sin(tangent) * leaf * 0.52 + Math.sin(a) * 5,
          px, py
        );
        g.fill();
      }
    }
    g.restore();
  }

  function buildBackground() {
    const off = document.createElement('canvas');
    off.width = W;
    off.height = H;
    const g = off.getContext('2d');
    const R = mulberry32(0x5EEDBEEF);

    // sky / depth wash
    const sky = g.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#0d2418');
    sky.addColorStop(0.24, '#183420');
    sky.addColorStop(0.48, '#314d2c');
    sky.addColorStop(0.66, '#647546');
    sky.addColorStop(0.79, '#a58e56');
    sky.addColorStop(1, '#3a3320');
    g.fillStyle = sky;
    g.fillRect(0, 0, W, H);

    // warm sun haze through the canopy
    let glow = g.createRadialGradient(1160, 155, 10, 1160, 155, 620);
    glow.addColorStop(0, 'rgba(255,232,164,0.58)');
    glow.addColorStop(0.28, 'rgba(244,204,121,0.24)');
    glow.addColorStop(0.7, 'rgba(168,154,88,0.06)');
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = glow;
    g.fillRect(0, 0, W, H);

    // far, hazy tree wall
    for (let i = 0; i < 28; i++) {
      const x = R() * W;
      const w = 8 + R() * 26;
      const top = 60 + R() * 190;
      const alpha = 0.12 + R() * 0.25;
      const grad = g.createLinearGradient(x - w, 0, x + w, 0);
      grad.addColorStop(0, `rgba(10,26,17,${alpha})`);
      grad.addColorStop(0.5, `rgba(32,54,32,${alpha + 0.06})`);
      grad.addColorStop(1, `rgba(8,22,14,${alpha})`);
      g.fillStyle = grad;
      g.fillRect(x - w / 2, top, w, 680 - top);
    }

    // far canopy
    const farPalettes = [
      ['rgba(13,35,21,0.62)', 'rgba(19,44,25,0.55)', 'rgba(29,56,31,0.48)'],
      ['rgba(20,43,26,0.55)', 'rgba(30,54,32,0.46)', 'rgba(41,65,38,0.4)']
    ];
    for (let i = 0; i < 14; i++) {
      drawCanopy(g, R() * W, 80 + R() * 235, 150 + R() * 270, 900 + i, farPalettes[i % 2]);
    }

    // middle distance trees
    drawTrunk(g, 250, 710, 700, 56, '#172619', '#3e4e30', 11, 0.7);
    drawTrunk(g, 1210, 700, 680, 62, '#152318', '#3a4a2d', 12, 0.66);
    drawTrunk(g, 1380, 720, 760, 78, '#132117', '#435534', 13, 0.76);
    drawTrunk(g, 550, 705, 620, 42, '#172619', '#3c4c2f', 14, 0.58);

    // framing trunks
    drawBigTree(g, 92, 910, 860, 118, 21, false);
    drawBigTree(g, 1510, 920, 900, 145, 22, true);

    // ground plane
    const ground = g.createLinearGradient(0, 600, 0, H);
    ground.addColorStop(0, '#697846');
    ground.addColorStop(0.18, '#52653b');
    ground.addColorStop(0.48, '#3d512f');
    ground.addColorStop(0.78, '#273821');
    ground.addColorStop(1, '#152117');
    g.fillStyle = ground;
    g.beginPath();
    g.moveTo(0, 624);
    g.bezierCurveTo(240, 598, 420, 648, 650, 623);
    g.bezierCurveTo(860, 600, 1070, 646, 1280, 620);
    g.bezierCurveTo(1400, 606, 1510, 628, 1600, 611);
    g.lineTo(1600, H);
    g.lineTo(0, H);
    g.closePath();
    g.fill();

    // moss and dirt washes
    for (let i = 0; i < 90; i++) {
      const x = R() * W;
      const y = 630 + R() * 270;
      const rx = 18 + R() * 95;
      const ry = 4 + R() * 18;
      g.fillStyle = R() > 0.46 ? `rgba(109,126,62,${0.035 + R() * 0.08})` : `rgba(46,35,21,${0.04 + R() * 0.09})`;
      ell(g, x, y, rx, ry, R() * 0.2);
      g.fill();
    }

    // the clearing light
    let pool = g.createRadialGradient(805, 690, 30, 805, 690, 470);
    pool.addColorStop(0, 'rgba(255,230,158,0.24)');
    pool.addColorStop(0.42, 'rgba(235,201,126,0.10)');
    pool.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = pool;
    g.fillRect(250, 420, 1100, 480);

    // scattered leaves
    for (let i = 0; i < 120; i++) {
      const x = R() * W;
      const y = 630 + R() * 260;
      const s = 2 + R() * 7;
      g.save();
      g.translate(x, y);
      g.rotate(R() * TAU);
      g.fillStyle = R() > 0.55 ? `rgba(124,93,43,${0.12 + R() * 0.2})` : `rgba(78,91,48,${0.12 + R() * 0.2})`;
      ell(g, 0, 0, s, s * 0.32, 0);
      g.fill();
      g.restore();
    }

    // little stones
    for (let i = 0; i < 20; i++) {
      const x = R() * W;
      const y = 660 + R() * 220;
      const rx = 4 + R() * 17;
      g.fillStyle = `rgba(91,93,72,${0.16 + R() * 0.22})`;
      ell(g, x, y, rx, rx * 0.38, R() * 0.3);
      g.fill();
      g.fillStyle = 'rgba(210,200,160,0.08)';
      ell(g, x - rx * 0.2, y - rx * 0.14, rx * 0.62, rx * 0.18, 0);
      g.fill();
    }

    // static background grasses, kept away from the clickable clumps
    for (let i = 0; i < 150; i++) {
      const x = R() * W;
      const y = 620 + R() * 280;
      if (x > 180 && x < 620 && y > 650) continue;
      if (x > 960 && x < 1110 && y > 640) continue;
      const h = 8 + R() * 42;
      const sway = (R() - 0.5) * 14;
      g.strokeStyle = R() > 0.6 ? 'rgba(127,146,74,0.36)' : 'rgba(73,99,51,0.42)';
      g.lineWidth = 0.8 + R() * 1.6;
      g.beginPath();
      g.moveTo(x, y);
      g.quadraticCurveTo(x + sway * 0.4, y - h * 0.55, x + sway, y - h);
      g.stroke();
    }

    // mushrooms
    for (let i = 0; i < 8; i++) {
      const x = 190 + R() * 1200;
      const y = 690 + R() * 170;
      if (x > 680 && x < 930) continue;
      const s = 3 + R() * 6;
      g.fillStyle = 'rgba(232,213,163,0.45)';
      g.fillRect(x - s * 0.13, y - s * 0.9, s * 0.26, s * 0.9);
      g.fillStyle = `rgba(${150 + R() * 50},${74 + R() * 30},${52 + R() * 20},0.62)`;
      ell(g, x, y - s, s, s * 0.48, 0);
      g.fill();
    }

    // mist bands
    for (let i = 0; i < 4; i++) {
      const y = 530 + i * 32 + R() * 16;
      const mist = g.createLinearGradient(0, y, 0, y + 60);
      mist.addColorStop(0, 'rgba(216,213,167,0)');
      mist.addColorStop(0.5, `rgba(216,213,167,${0.035 - i * 0.005})`);
      mist.addColorStop(1, 'rgba(216,213,167,0)');
      g.fillStyle = mist;
      g.fillRect(0, y, W, 60);
    }

    // foreground broad-leaf plants
    drawBroadLeaf(g, 52, 928, 2.4, -0.24, 'rgba(19,42,24,0.96)', 41);
    drawBroadLeaf(g, 146, 968, 1.7, -0.62, 'rgba(26,51,28,0.9)', 42);
    drawBroadLeaf(g, 1524, 944, 2.6, 3.42, 'rgba(17,39,23,0.97)', 43);
    drawBroadLeaf(g, 1428, 982, 1.65, 2.9, 'rgba(27,53,29,0.9)', 44);

    bgCanvas = off;
  }

  /* ─────────────────────────────────────────────────────────────
     chick
     ───────────────────────────────────────────────────────────── */

  function makeTufts(count, seed) {
    const r = mulberry32(seed);
    const out = [];
    for (let i = 0; i < count; i++) {
      const a = r() * TAU;
      const rad = Math.sqrt(r()) * 0.96;
      out.push({
        x: Math.cos(a) * rad,
        y: Math.sin(a) * rad,
        len: 0.045 + r() * 0.11,
        angle: a + (r() - 0.5) * 0.8,
        bend: (r() - 0.5) * 0.9,
        width: 0.55 + r() * 1.1,
        alpha: 0.10 + r() * 0.24,
        light: r()
      });
    }
    return out;
  }

  const BODY_TUFTS = makeTufts(240, 78123);
  const HEAD_TUFTS = makeTufts(150, 99117);

  function getChickGeometry(weight) {
    const f = clamp((weight - 12) / 96, 0, 1.15);
    const rx = 58 + 40 * f;
    const ry = 78 + 32 * f;
    const legH = 45 - 9 * f;
    const bodyCY = -legH - ry * 0.56;
    const headR = 43 + 8 * Math.min(1, f * 1.8);
    const headCX = rx * 0.43;
    const headCY = bodyCY - ry * 0.64;
    return { f, rx, ry, legH, bodyCY, headCX, headCY, headR };
  }

  function getChickBox(weight) {
    const geo = getChickGeometry(weight);
    const top = (geo.headCY - geo.headR * 1.15) * CHICK_SCALE + CHICK_Y;
    const bottom = CHICK_Y + 6;
    const rx = (geo.rx * 1.25) * CHICK_SCALE;
    return {
      x: CHICK_X - rx * 0.52,
      y: top,
      w: rx * 1.22,
      h: bottom - top,
      cx: CHICK_X,
      cy: (top + bottom) / 2
    };
  }

  function eggPath(g, cx, cy, rx, ry, phase) {
    g.beginPath();
    const n = 96;
    for (let i = 0; i <= n; i++) {
      const a = (i / n) * TAU;
      const wob = 1 + Math.sin(a * 3 + phase) * 0.017 + Math.sin(a * 5 + 1.4) * 0.01;
      const x = cx + Math.cos(a) * rx * wob;
      const y = cy + Math.sin(a) * ry * wob;
      if (i === 0) g.moveTo(x, y);
      else g.lineTo(x, y);
    }
    g.closePath();
  }

  function fluffRing(g, cx, cy, rx, ry, seed, time, lightAngle, colors) {
    const r = mulberry32(seed);
    const n = 92;
    g.save();
    g.lineCap = 'round';
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU + Math.sin(time * 0.55 + i * 0.7) * 0.006;
      const wob = 1 + Math.sin(a * 3 + 1.2) * 0.02;
      const px = cx + Math.cos(a) * rx * wob * 0.978;
      const py = cy + Math.sin(a) * ry * wob * 0.978;
      const out = 0.022 + Math.pow(r(), 1.7) * 0.055;
      const lean = (r() - 0.5) * 0.09;
      const ex = cx + Math.cos(a + lean) * rx * (1 + out);
      const ey = cy + Math.sin(a + lean) * ry * (1 + out);
      const lit = Math.cos(a - lightAngle) > 0.02;
      g.strokeStyle = lit ? colors[0] : colors[1];
      g.globalAlpha = lit ? 0.28 + r() * 0.24 : 0.18 + r() * 0.18;
      g.lineWidth = (0.6 + r() * 1.35) * (rx > 80 ? 1.25 : 1);
      g.beginPath();
      g.moveTo(px, py);
      g.quadraticCurveTo(
        lerp(px, ex, 0.62) + Math.cos(a + 1.57) * 2.2,
        lerp(py, ey, 0.62) + Math.sin(a + 1.57) * 2.2,
        ex,
        ey
      );
      g.stroke();
      // a second, shorter down fiber beside some strands
      if (r() > 0.58) {
        const a2 = a - 0.045;
        const ex2 = cx + Math.cos(a2) * rx * (1 + out * 0.6);
        const ey2 = cy + Math.sin(a2) * ry * (1 + out * 0.6);
        g.globalAlpha *= 0.72;
        g.lineWidth *= 0.8;
        g.beginPath();
        g.moveTo(px + Math.cos(a2) * 2, py + Math.sin(a2) * 2);
        g.quadraticCurveTo(
          lerp(px, ex2, 0.55) + Math.cos(a2 + 1.57) * 1.5,
          lerp(py, ey2, 0.55) + Math.sin(a2 + 1.57) * 1.5,
          ex2,
          ey2
        );
        g.stroke();
      }
    }
    g.restore();
  }

  function downHalo(g, cx, cy, rx, ry, color) {
    const halo = g.createRadialGradient(cx, cy, rx * 0.55, cx, cy, rx * 1.2);
    halo.addColorStop(0, color);
    halo.addColorStop(0.76, color.replace(/[\d.]+\)$/, '0.10)'));
    halo.addColorStop(1, color.replace(/[\d.]+\)$/, '0)'));
    g.fillStyle = halo;
    g.beginPath();
    g.ellipse(cx, cy, rx * 1.22, ry * 1.2, 0, 0, TAU);
    g.fill();
  }

  function drawDapple(g, cx, cy, rx, ry, time, seed) {
    const r = mulberry32(seed);
    g.save();
    g.globalCompositeOperation = 'screen';
    for (let i = 0; i < 4; i++) {
      const x = cx + (r() - 0.5) * rx * 1.5;
      const y = cy + (r() - 0.5) * ry * 1.4;
      const rr = 7 + r() * 19;
      const grad = g.createRadialGradient(x, y, 0, x, y, rr);
      grad.addColorStop(0, `rgba(255,236,172,${0.10 + r() * 0.08})`);
      grad.addColorStop(0.5, `rgba(255,228,152,${0.05 + r() * 0.04})`);
      grad.addColorStop(1, 'rgba(255,228,152,0)');
      g.fillStyle = grad;
      g.beginPath();
      g.ellipse(x + Math.sin(time * 0.3 + i) * 3, y, rr, rr * 0.7, r() * 0.8, 0, TAU);
      g.fill();
    }
    g.restore();
  }

  function drawFeatherRows(g, cx, cy, rx, ry, time, palette) {
    g.save();
    g.lineCap = 'round';
    for (let row = 0; row < 5; row++) {
      const yy = cy - ry * 0.34 + row * ry * 0.19;
      const span = rx * (0.56 - Math.abs(row - 2) * 0.07);
      for (let i = 0; i < 7; i++) {
        const x = cx - span + (i / 6) * span * 2 + (row % 2) * 6;
        const len = 9 + (i % 3) * 4 + (2 - Math.abs(row - 2)) * 2;
        const sway = Math.sin(time * 0.8 + row * 1.4 + i * 0.8) * 0.8;
        g.strokeStyle = palette[i % 3];
        g.globalAlpha = 0.12 + (i % 3) * 0.035;
        g.lineWidth = 1.15;
        g.beginPath();
        g.moveTo(x, yy);
        g.quadraticCurveTo(x + 2 + sway, yy + len * 0.55, x + 4 + sway, yy + len);
        g.stroke();
      }
    }
    g.restore();
  }

  function drawTufts(g, cx, cy, rx, ry, tufts, scale, time, palette) {
    g.save();
    g.lineCap = 'round';
    for (let i = 0; i < tufts.length; i++) {
      const t = tufts[i];
      const px = cx + t.x * rx * 0.965;
      const py = cy + t.y * ry * 0.965;
      const len = t.len * Math.min(rx, ry) * 1.1;
      const a = t.angle + Math.sin(time * 0.7 + i) * 0.018;
      const ex = px + Math.cos(a) * len;
      const ey = py + Math.sin(a) * len;
      g.strokeStyle = t.light > 0.42 ? palette[0] : palette[1];
      g.globalAlpha = t.alpha;
      g.lineWidth = t.width * scale;
      g.beginPath();
      g.moveTo(px, py);
      g.quadraticCurveTo(
        lerp(px, ex, 0.6) + Math.cos(a + 1.57) * len * t.bend * 0.6,
        lerp(py, ey, 0.6) + Math.sin(a + 1.57) * len * t.bend * 0.6,
        ex,
        ey
      );
      g.stroke();
    }
    g.restore();
  }

  function drawFoot(g, x, y, front, t, mood) {
    const dark = front ? '#8e5217' : '#694014';
    const lite = front ? '#e8ac47' : '#bf7e2b';
    g.save();
    g.lineCap = 'round';
    g.lineJoin = 'round';

    // downy thigh
    if (front) {
      g.fillStyle = 'rgba(246,221,161,0.76)';
      g.beginPath();
      g.ellipse(x, y - 40, 9, 12, 0, 0, TAU);
      g.fill();
    }

    // leg
    const grad = g.createLinearGradient(x - 5, y - 42, x + 7, y);
    grad.addColorStop(0, lite);
    grad.addColorStop(0.56, front ? '#cf8a2b' : '#a56623');
    grad.addColorStop(1, dark);
    g.strokeStyle = grad;
    g.lineWidth = front ? 6.8 : 5.8;
    g.beginPath();
    g.moveTo(x, y - 45);
    g.bezierCurveTo(x + 1.5, y - 30, x - 2.2, y - 17, x, y - 7);
    g.stroke();

    // ankle joint
    g.fillStyle = front ? '#b87622' : '#8a551d';
    g.beginPath();
    g.ellipse(x, y - 9, 3.8, 3.2, 0, 0, TAU);
    g.fill();

    // scales
    g.strokeStyle = 'rgba(76,42,12,0.34)';
    g.lineWidth = 0.85;
    for (let i = 0; i < 5; i++) {
      const sy = y - 37 + i * 6.2;
      g.beginPath();
      g.arc(x, sy, 3.2, 0.12, Math.PI - 0.12);
      g.stroke();
    }

    // toes
    const toes = [
      { dx: -12, dy: 4 },
      { dx: -3, dy: 7 },
      { dx: 7, dy: 6 },
      { dx: 13, dy: 2 },
      { dx: -1, dy: -8 }
    ];
    for (let i = 0; i < toes.length; i++) {
      const to = toes[i];
      const tipX = x + to.dx;
      const tipY = y + to.dy;
      g.strokeStyle = i === 4 ? dark : grad;
      g.lineWidth = i === 4 ? 3.4 : 4.2;
      g.beginPath();
      g.moveTo(x, y - 7);
      g.quadraticCurveTo(x + to.dx * 0.38, y + 1.4, tipX, tipY);
      g.stroke();
      // toe joint
      if (i !== 4) {
        g.fillStyle = 'rgba(106,58,17,0.4)';
        g.beginPath();
        g.arc(x + to.dx * 0.55, y + to.dy * 0.55 - 1, 1.5, 0, TAU);
        g.fill();
      }
      g.fillStyle = '#42260e';
      g.beginPath();
      g.moveTo(tipX + 0.8, tipY + 3.2);
      g.lineTo(tipX - 2.3, tipY - 1.9);
      g.lineTo(tipX + 2.5, tipY - 1.5);
      g.closePath();
      g.fill();
    }

    // top highlight
    g.strokeStyle = 'rgba(255,224,150,0.34)';
    g.lineWidth = 1.1;
    g.beginPath();
    g.moveTo(x - 1.8, y - 41);
    g.quadraticCurveTo(x, y - 24, x - 1.6, y - 12);
    g.stroke();
    g.restore();
  }

  function drawWing(g, x, y, s, rot, dark, light, adult, flap) {
    g.save();
    g.translate(x, y);
    g.rotate(rot + flap);
    g.scale(s, s);

    // soft shadow under the wing
    g.fillStyle = 'rgba(71,40,10,0.18)';
    g.beginPath();
    g.ellipse(4, 10, 32, 42, 0.14, 0, TAU);
    g.fill();

    const n = adult ? 5 : 4;
    for (let i = 0; i < n; i++) {
      const ox = -7 + i * 5.8;
      const oy = 3 + i * 1.2;
      const tip = 37 + i * 3;
      g.save();
      g.translate(ox, oy);
      g.rotate(0.15 + i * 0.055);
      const grad = g.createLinearGradient(0, -18, 8, tip);
      grad.addColorStop(0, light);
      grad.addColorStop(0.38, dark[0]);
      grad.addColorStop(1, dark[1]);
      g.fillStyle = grad;
      g.beginPath();
      g.moveTo(-3, -18);
      g.bezierCurveTo(17, -17, 24, 9, 16, tip);
      g.bezierCurveTo(9, tip + 8, 0, tip + 5, -4, 20);
      g.closePath();
      g.fill();
      g.strokeStyle = 'rgba(255,240,197,0.18)';
      g.lineWidth = 0.9;
      g.beginPath();
      g.moveTo(-1, -15);
      g.quadraticCurveTo(6, 10, 8, tip);
      g.stroke();
      g.strokeStyle = 'rgba(106,64,20,0.3)';
      g.lineWidth = 0.8;
      g.beginPath();
      g.moveTo(1, 4);
      g.quadraticCurveTo(8, 11, 11, 22);
      g.stroke();
      g.restore();
    }

    // overlapping covert feathers at the shoulder
    for (let i = 0; i < 4; i++) {
      const cx = -11 + i * 8;
      const cy = -7 - Math.abs(i - 1.5) * 2;
      const cg = g.createLinearGradient(cx, cy - 10, cx, cy + 12);
      cg.addColorStop(0, light);
      cg.addColorStop(0.65, dark[0]);
      cg.addColorStop(1, dark[1]);
      g.fillStyle = cg;
      g.beginPath();
      g.moveTo(cx - 7, cy + 6);
      g.quadraticCurveTo(cx - 8, cy - 7, cx + 1, cy - 10);
      g.quadraticCurveTo(cx + 10, cy - 5, cx + 7, cy + 7);
      g.quadraticCurveTo(cx, cy + 12, cx - 7, cy + 6);
      g.fill();
      g.strokeStyle = 'rgba(255,241,196,0.22)';
      g.lineWidth = 0.8;
      g.stroke();
    }

    // downy fringe
    g.lineCap = 'round';
    for (let i = 0; i < 11; i++) {
      const a = 0.2 + i * 0.115;
      const baseX = 9 - i * 1.4;
      const baseY = 28 + i * 1.7;
      g.strokeStyle = `rgba(255,242,198,${0.18 + (i % 3) * 0.06})`;
      g.lineWidth = 0.9;
      g.beginPath();
      g.moveTo(baseX, baseY);
      g.quadraticCurveTo(baseX + 4, baseY + 7, baseX + Math.cos(a) * 11, baseY + 10 + Math.sin(a) * 6);
      g.stroke();
    }

    // specular edge
    g.strokeStyle = 'rgba(255,248,216,0.32)';
    g.lineWidth = 1.3;
    g.beginPath();
    g.moveTo(-3, -15);
    g.bezierCurveTo(12, -12, 18, 8, 12, 26);
    g.stroke();
    g.restore();
  }

  function drawEye(g, x, y, rad, blink, mood, monster) {
    if (monster) {
      g.save();
      const glow = g.createRadialGradient(x, y, 1, x, y, rad * 3.4);
      glow.addColorStop(0, 'rgba(255,64,34,0.62)');
      glow.addColorStop(1, 'rgba(255,64,34,0)');
      g.fillStyle = glow;
      g.beginPath();
      g.arc(x, y, rad * 3.4, 0, TAU);
      g.fill();
      g.fillStyle = '#070403';
      g.beginPath();
      g.ellipse(x, y, rad * 1.32, rad * 1.52, 0, 0, TAU);
      g.fill();
      g.fillStyle = '#ce2f1b';
      g.beginPath();
      g.arc(x, y, rad * 0.72, 0, TAU);
      g.fill();
      g.fillStyle = '#130604';
      g.beginPath();
      g.ellipse(x, y, rad * 0.18, rad * 0.8, 0, 0, TAU);
      g.fill();
      g.fillStyle = 'rgba(255,216,180,0.8)';
      g.beginPath();
      g.arc(x - rad * 0.28, y - rad * 0.34, rad * 0.14, 0, TAU);
      g.fill();
      g.restore();
      return;
    }

    if (mood === 'dead') {
      g.save();
      g.strokeStyle = '#4b223f';
      g.lineWidth = 2.1;
      g.lineCap = 'round';
      g.beginPath();
      g.moveTo(x - rad * 0.9, y - rad * 0.9);
      g.lineTo(x + rad * 0.9, y + rad * 0.9);
      g.moveTo(x + rad * 0.9, y - rad * 0.9);
      g.lineTo(x - rad * 0.9, y + rad * 0.9);
      g.stroke();
      g.restore();
      return;
    }

    if (blink > 0.9 || mood === 'happy' && blink > 0.56) {
      g.strokeStyle = '#6e4a20';
      g.lineWidth = 2;
      g.lineCap = 'round';
      g.beginPath();
      g.arc(x, y + rad * 0.1, rad * 0.95, 0.18, Math.PI - 0.18);
      g.stroke();
      return;
    }

    const sy = 1 - blink * 0.92;
    g.save();
    g.translate(x, y);
    g.scale(1, sy);

    // socket / skin shading
    g.fillStyle = 'rgba(111,71,24,0.32)';
    g.beginPath();
    g.ellipse(0, 0, rad * 1.34, rad * 1.36, 0, 0, TAU);
    g.fill();

    // narrow amber eye-ring
    g.fillStyle = 'rgba(178,121,50,0.58)';
    g.beginPath();
    g.arc(0, 0, rad * 1.1, 0, TAU);
    g.fill();

    // glossy dark eye
    const iris = g.createRadialGradient(-rad * 0.28, -rad * 0.36, rad * 0.08, 0, 0, rad * 1.08);
    iris.addColorStop(0, '#6b4926');
    iris.addColorStop(0.38, '#2a180d');
    iris.addColorStop(1, '#050302');
    g.fillStyle = iris;
    g.beginPath();
    g.arc(0, 0, rad, 0, TAU);
    g.fill();

    // warm lower iris reflection
    g.fillStyle = 'rgba(194,132,54,0.26)';
    g.beginPath();
    g.ellipse(rad * 0.18, rad * 0.38, rad * 0.48, rad * 0.26, 0.2, 0, TAU);
    g.fill();

    // catch lights
    g.fillStyle = 'rgba(255,255,247,0.96)';
    g.beginPath();
    g.arc(-rad * 0.35, -rad * 0.42, rad * 0.23, 0, TAU);
    g.fill();
    g.fillStyle = 'rgba(215,235,255,0.58)';
    g.beginPath();
    g.arc(rad * 0.32, rad * 0.22, rad * 0.1, 0, TAU);
    g.fill();

    // eyelid rim
    g.strokeStyle = 'rgba(76,46,17,0.5)';
    g.lineWidth = 1.1;
    g.beginPath();
    g.arc(0, 0, rad * 1.05, Math.PI * 1.05, Math.PI * 1.95);
    g.stroke();

    g.restore();
  }

  function drawBeak(g, x, y, r, open, monster) {
    g.save();
    g.translate(x, y);
    const upper = g.createLinearGradient(0, -r * 0.2, r * 0.8, r * 0.35);
    upper.addColorStop(0, monster ? '#743024' : '#f2b04b');
    upper.addColorStop(0.55, monster ? '#3a1712' : '#dc8d2f');
    upper.addColorStop(1, monster ? '#1a0806' : '#a95c1d');
    g.fillStyle = upper;
    g.beginPath();
    g.moveTo(-r * 0.08, -r * 0.2);
    g.quadraticCurveTo(r * 0.48, -r * 0.28, r * 0.84, r * 0.04);
    g.quadraticCurveTo(r * 0.45, r * 0.22, -r * 0.06, r * 0.12);
    g.closePath();
    g.fill();

    g.fillStyle = monster ? '#2a0d0a' : '#b66a22';
    g.beginPath();
    g.moveTo(-r * 0.03, r * 0.09 + open * r * 0.26);
    g.quadraticCurveTo(r * 0.4, r * 0.28 + open * r * 0.22, r * 0.64, r * 0.1 + open * r * 0.2);
    g.quadraticCurveTo(r * 0.38, r * 0.34 + open * r * 0.24, -r * 0.04, r * 0.2 + open * r * 0.2);
    g.closePath();
    g.fill();

    g.strokeStyle = 'rgba(84,42,12,0.6)';
    g.lineWidth = 1.1;
    g.beginPath();
    g.moveTo(0, r * 0.13 + open * r * 0.2);
    g.quadraticCurveTo(r * 0.35, r * 0.2 + open * r * 0.2, r * 0.65, r * 0.1 + open * r * 0.18);
    g.stroke();

    g.fillStyle = 'rgba(76,38,10,0.62)';
    g.beginPath();
    g.ellipse(r * 0.12, -r * 0.08, r * 0.035, r * 0.055, -0.2, 0, TAU);
    g.fill();

    g.fillStyle = 'rgba(255,235,190,0.4)';
    g.beginPath();
    g.moveTo(r * 0.02, -r * 0.12);
    g.quadraticCurveTo(r * 0.3, -r * 0.16, r * 0.55, -r * 0.01);
    g.quadraticCurveTo(r * 0.27, -r * 0.06, r * 0.04, r * 0.02);
    g.closePath();
    g.fill();
    g.restore();
  }

  function drawComb(g, x, y, r, age, monster) {
    if (age < 0.18 && !monster) {
      g.fillStyle = 'rgba(201,98,71,0.55)';
      ell(g, x, y, r * 0.1, r * 0.07, 0);
      g.fill();
      return;
    }
    const s = clamp(age, 0.2, 1);
    g.save();
    g.translate(x, y);
    const grad = g.createLinearGradient(0, -r * 0.6, 0, r * 0.2);
    grad.addColorStop(0, monster ? '#a52d1f' : '#e07861');
    grad.addColorStop(1, monster ? '#4b100c' : '#a53c33');
    g.fillStyle = grad;
    g.beginPath();
    g.moveTo(-r * 0.32 * s, r * 0.08);
    g.bezierCurveTo(-r * (0.42 + 0.1 * s), -r * 0.34 * s, -r * 0.3, -r * 0.62 * s, -r * 0.13 * s, -r * 0.38 * s);
    g.bezierCurveTo(-r * 0.12, -r * 0.7 * s, r * 0.02, -r * 0.72 * s, r * 0.07 * s, -r * 0.4 * s);
    g.bezierCurveTo(r * 0.22, -r * 0.67 * s, r * 0.38, -r * 0.5 * s, r * 0.23 * s, -r * 0.2 * s);
    g.bezierCurveTo(r * 0.39, -r * 0.3 * s, r * 0.42, -r * 0.03 * s, r * 0.26 * s, r * 0.1);
    g.closePath();
    g.fill();
    g.strokeStyle = 'rgba(255,196,162,0.28)';
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(-r * 0.22 * s, -r * 0.16 * s);
    g.quadraticCurveTo(-r * 0.1, -r * 0.35 * s, r * 0.02, -r * 0.2 * s);
    g.stroke();
    g.restore();
  }

  function drawTail(g, x, y, f, adult, monster) {
    g.save();
    g.translate(x, y);
    const n = adult ? 5 : 3;
    for (let i = 0; i < n; i++) {
      const a = -1.08 + i * 0.34;
      const len = (adult ? 42 : 22) + (adult ? 12 : 0) * Math.sin(i * 1.7);
      g.save();
      g.rotate(a + 0.25);
      const grad = g.createLinearGradient(0, 0, 0, -len);
      grad.addColorStop(0, monster ? '#260b08' : (i % 2 ? '#dbb168' : '#f0d08a'));
      grad.addColorStop(1, monster ? '#711e14' : (i % 2 ? '#a97836' : '#c79a4d'));
      g.fillStyle = grad;
      g.beginPath();
      g.moveTo(-4, 0);
      g.quadraticCurveTo(-len * 0.26, -len * 0.6, 0, -len);
      g.quadraticCurveTo(len * 0.28, -len * 0.58, 5, 0);
      g.closePath();
      g.fill();
      g.strokeStyle = 'rgba(116,72,24,0.24)';
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(0, -len * 0.86);
      g.lineTo(0, -4);
      g.stroke();
      g.restore();
    }
    g.restore();
  }

  function drawChick(g, state, now) {
    const weight = state.weight;
    const geo = getChickGeometry(weight);
    const mood = state.chickMood || 'idle';
    const monster = !!state.monster;
    const age = clamp((weight - 28) / 72, 0, 1);
    const t = now / 1000;
    const blink = state.blink || 0;
    const peck = state.peck || 0;

    const hop = mood === 'happy' ? -Math.abs(Math.sin(t * 9)) * 7 : 0;
    const breath = 1 + Math.sin(t * 1.9) * 0.009;
    const lean = Math.sin(t * 0.63) * 0.008 + (mood === 'dead' ? 0.36 : 0);

    g.save();
    const flying = state.flying;
    if (flying) {
      const p = clamp((now - state.flyStart) / 3200, 0, 1);
      const rise = ease(p) * 470;
      g.globalAlpha = clamp(1 - Math.max(0, p - 0.6) * 1.7, 0, 1);
      g.translate(0, -rise);
      g.rotate(p * 0.34);
    }

    g.translate(CHICK_X, CHICK_Y + hop);
    g.scale(CHICK_SCALE * breath, CHICK_SCALE * breath);
    g.rotate(lean);

    if (mood === 'dead') {
      g.translate(0, 9);
      g.rotate(0.38);
      g.scale(1.02, 0.72);
    }

    const bodyPalette = monster
      ? ['rgba(255,173,128,0.26)', 'rgba(54,10,7,0.3)']
      : ['rgba(255,250,226,0.34)', 'rgba(119,72,18,0.28)'];
    const lightAngle = -2.25;

    // far leg
    drawFoot(g, -geo.rx * 0.28, 0, false, t, mood);

    // tail
    drawTail(g, -geo.rx * 0.78, geo.bodyCY + geo.ry * 0.38, geo.f, age > 0.35, monster);

    // far wing
    drawWing(
      g,
      -geo.rx * 0.52,
      geo.bodyCY + geo.ry * 0.05,
      0.9,
      -0.45,
      ['#c19045', '#8e6225'],
      '#efd497',
      age > 0.45,
      Math.sin(t * 2.1) * 0.02
    );

    // body silhouette fuzz
    if (!monster) {
      downHalo(g, 0, geo.bodyCY, geo.rx, geo.ry, 'rgba(255,238,184,0.10)');
      g.save();
      g.filter = 'blur(3px)';
      g.strokeStyle = 'rgba(255,240,196,0.16)';
      g.lineWidth = 6;
      eggPath(g, 0, geo.bodyCY, geo.rx, geo.ry, 0.4);
      g.stroke();
      g.restore();
    }
    fluffRing(g, 0, geo.bodyCY, geo.rx, geo.ry, 4545, t, lightAngle, bodyPalette);

    // body fill
    eggPath(g, 0, geo.bodyCY, geo.rx, geo.ry, 0.4);
    const bodyGrad = g.createRadialGradient(
      -geo.rx * 0.38, geo.bodyCY - geo.ry * 0.48, geo.rx * 0.08,
      0, geo.bodyCY, geo.ry * 1.16
    );
    if (monster) {
      bodyGrad.addColorStop(0, '#5f2418');
      bodyGrad.addColorStop(0.38, '#35130f');
      bodyGrad.addColorStop(0.74, '#1d0a07');
      bodyGrad.addColorStop(1, '#090302');
    } else {
      bodyGrad.addColorStop(0, '#fffce9');
      bodyGrad.addColorStop(0.22, '#fae9b8');
      bodyGrad.addColorStop(0.5, '#efca79');
      bodyGrad.addColorStop(0.76, '#d59b48');
      bodyGrad.addColorStop(0.92, '#b5772c');
      bodyGrad.addColorStop(1, '#7f4d18');
    }
    g.fillStyle = bodyGrad;
    g.fill();

    // body texture clipped inside
    g.save();
    eggPath(g, 0, geo.bodyCY, geo.rx, geo.ry, 0.4);
    g.clip();

    const under = g.createRadialGradient(
      -geo.rx * 0.1, geo.bodyCY + geo.ry * 0.62, 4,
      -geo.rx * 0.1, geo.bodyCY + geo.ry * 0.62, geo.rx * 0.9
    );
    under.addColorStop(0, monster ? 'rgba(0,0,0,0.5)' : 'rgba(137,83,25,0.30)');
    under.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = under;
    g.fillRect(-geo.rx, geo.bodyCY - geo.ry, geo.rx * 2, geo.ry * 2);

    drawTufts(g, 0, geo.bodyCY, geo.rx, geo.ry, BODY_TUFTS, 1.2, t, bodyPalette);
    if (!monster) {
      drawFeatherRows(g, 0, geo.bodyCY, geo.rx, geo.ry, t, [
        'rgba(255,249,225,0.9)',
        'rgba(214,164,80,0.9)',
        'rgba(255,240,200,0.9)'
      ]);
      drawDapple(g, 0, geo.bodyCY, geo.rx, geo.ry, t, 419);
    }

    // directional core shadow on the lower-right
    if (!monster) {
      g.save();
      g.globalCompositeOperation = 'multiply';
      const shade = g.createLinearGradient(-geo.rx * 0.35, geo.bodyCY - geo.ry * 0.5, geo.rx * 0.8, geo.bodyCY + geo.ry * 0.8);
      shade.addColorStop(0, 'rgba(255,255,255,0)');
      shade.addColorStop(0.48, 'rgba(176,142,91,0.08)');
      shade.addColorStop(1, 'rgba(92,55,18,0.34)');
      g.fillStyle = shade;
      g.fillRect(-geo.rx, geo.bodyCY - geo.ry, geo.rx * 2, geo.ry * 2);
      g.restore();
    }

    // warm reflected light on the belly
    if (!monster) {
      const belly = g.createRadialGradient(geo.rx * 0.28, geo.bodyCY + geo.ry * 0.38, 2, geo.rx * 0.28, geo.bodyCY + geo.ry * 0.38, geo.rx * 0.56);
      belly.addColorStop(0, 'rgba(255,238,183,0.20)');
      belly.addColorStop(1, 'rgba(255,238,183,0)');
      g.fillStyle = belly;
      g.fillRect(-geo.rx, geo.bodyCY - geo.ry, geo.rx * 2, geo.ry * 2);
    }

    // ambient occlusion under the head
    const ao = g.createRadialGradient(
      geo.headCX * 0.4, geo.bodyCY - geo.ry * 0.28, 2,
      geo.headCX * 0.4, geo.bodyCY - geo.ry * 0.28, geo.headR * 1.6
    );
    ao.addColorStop(0, 'rgba(82,45,10,0.22)');
    ao.addColorStop(1, 'rgba(82,45,10,0)');
    g.fillStyle = ao;
    g.fillRect(-geo.rx, geo.bodyCY - geo.ry, geo.rx * 2, geo.ry * 2);
    g.restore();

    // rim light
    g.save();
    g.globalCompositeOperation = 'screen';
    g.strokeStyle = monster ? 'rgba(255,96,52,0.32)' : 'rgba(255,244,198,0.42)';
    g.lineWidth = 2.2;
    g.beginPath();
    g.ellipse(0, geo.bodyCY, geo.rx, geo.ry, 0, -0.45, 0.82);
    g.stroke();
    g.restore();

    // near wing
    drawWing(
      g,
      geo.rx * 0.47,
      geo.bodyCY + geo.ry * 0.12,
      1,
      0.3,
      monster ? ['#3a110c', '#170504'] : ['#d6a153', '#9d6a26'],
      monster ? '#6e2619' : '#f6e0a4',
      age > 0.45,
      Math.sin(t * 1.8 + 1) * 0.022 + (flying ? Math.sin(t * 17) * 0.7 : 0)
    );

    // neck shadow and ruff
    g.save();
    const neckShadow = g.createRadialGradient(
      geo.headCX * 0.55, geo.bodyCY - geo.ry * 0.34, 3,
      geo.headCX * 0.55, geo.bodyCY - geo.ry * 0.34, geo.headR * 1.35
    );
    neckShadow.addColorStop(0, monster ? 'rgba(0,0,0,0.44)' : 'rgba(97,54,12,0.28)');
    neckShadow.addColorStop(1, 'rgba(97,54,12,0)');
    g.fillStyle = neckShadow;
    g.beginPath();
    g.ellipse(geo.headCX * 0.55, geo.bodyCY - geo.ry * 0.34, geo.headR * 1.28, geo.headR * 0.66, 0.06, 0, TAU);
    g.fill();
    g.restore();

    if (!monster) {
      g.save();
      g.strokeStyle = 'rgba(255,250,226,0.34)';
      g.lineWidth = 1.4;
      g.lineCap = 'round';
      for (let i = 0; i < 18; i++) {
        const a = -1.1 + (i / 17) * 2.2;
        const bx = geo.headCX + Math.cos(a) * geo.headR * 0.72;
        const by = geo.bodyCY - geo.ry * 0.28 + Math.sin(a) * 7;
        g.beginPath();
        g.moveTo(bx, by);
        g.quadraticCurveTo(bx + Math.cos(a) * 5, by + 8, bx + Math.cos(a) * 7, by + 14 + (i % 3) * 2);
        g.stroke();
      }
      g.restore();
    }

    // neck / head fluff
    fluffRing(
      g,
      geo.headCX, geo.headCY, geo.headR * 0.96, geo.headR * 1.03,
      991, t + 2, lightAngle,
      monster ? ['rgba(255,142,102,0.2)', 'rgba(60,12,8,0.32)'] : ['rgba(255,252,235,0.4)', 'rgba(127,76,19,0.26)']
    );

    // head fill
    if (!monster) {
      downHalo(g, geo.headCX, geo.headCY, geo.headR * 0.96, geo.headR * 1.03, 'rgba(255,244,199,0.08)');
      g.save();
      g.filter = 'blur(2px)';
      g.strokeStyle = 'rgba(255,245,211,0.18)';
      g.lineWidth = 5;
      eggPath(g, geo.headCX, geo.headCY, geo.headR * 0.96, geo.headR * 1.03, 1.2);
      g.stroke();
      g.restore();
    }
    const headX = geo.headCX + Math.sin(t * 1.2) * 0.7;
    const headY = geo.headCY + Math.sin(t * 1.7 + 0.6) * 1.1
      + (peck ? (mood === 'eating' ? 5 : 0) + (0.5 + 0.5 * Math.sin(t * 15)) * 8 * peck : 0);
    eggPath(g, headX, headY, geo.headR * 0.96, geo.headR * 1.03, 1.2);
    const headGrad = g.createRadialGradient(
      headX - geo.headR * 0.38, headY - geo.headR * 0.42, 3,
      headX, headY, geo.headR * 1.28
    );
    if (monster) {
      headGrad.addColorStop(0, '#66261a');
      headGrad.addColorStop(0.5, '#2c0e0a');
      headGrad.addColorStop(1, '#0b0302');
    } else {
      headGrad.addColorStop(0, '#fffef5');
      headGrad.addColorStop(0.3, '#fdf2cf');
      headGrad.addColorStop(0.66, '#f2d28e');
      headGrad.addColorStop(0.88, '#d39b4c');
      headGrad.addColorStop(1, '#9c6425');
    }
    g.fillStyle = headGrad;
    g.fill();

    g.save();
    eggPath(g, headX, headY, geo.headR * 0.96, geo.headR * 1.03, 1.2);
    g.clip();
    drawTufts(g, headX, headY, geo.headR * 0.96, geo.headR * 1.03, HEAD_TUFTS, 0.85, t + 1.4,
      monster ? ['rgba(255,153,112,0.2)', 'rgba(35,5,4,0.34)'] : ['rgba(255,255,244,0.44)', 'rgba(127,76,19,0.24)']);
    if (!monster) {
      drawDapple(g, headX, headY, geo.headR * 0.96, geo.headR * 1.03, t + 1.2, 733);
      g.save();
      g.globalCompositeOperation = 'multiply';
      const headShade = g.createLinearGradient(headX - geo.headR * 0.45, headY - geo.headR * 0.5, headX + geo.headR * 0.7, headY + geo.headR * 0.8);
      headShade.addColorStop(0, 'rgba(255,255,255,0)');
      headShade.addColorStop(0.6, 'rgba(189,153,96,0.08)');
      headShade.addColorStop(1, 'rgba(90,52,15,0.26)');
      g.fillStyle = headShade;
      g.fillRect(headX - geo.headR, headY - geo.headR, geo.headR * 2, geo.headR * 2);
      g.restore();
    }
    g.restore();

    // crown tuft
    g.save();
    g.strokeStyle = monster ? 'rgba(160,40,25,0.7)' : 'rgba(255,246,210,0.72)';
    g.lineCap = 'round';
    for (let i = 0; i < 7; i++) {
      const a = -1.8 + i * 0.11;
      const bx = headX - geo.headR * 0.2 + i * 2.2;
      const by = headY - geo.headR * 0.88;
      g.lineWidth = 1.2 + (i % 3) * 0.4;
      g.beginPath();
      g.moveTo(bx, by);
      g.quadraticCurveTo(bx + Math.cos(a) * 8, by - 8, bx + Math.cos(a) * 15, by + Math.sin(a) * 9 - 8);
      g.stroke();
    }
    g.restore();

    // comb
    drawComb(g, headX + geo.headR * 0.08, headY - geo.headR * 0.87, geo.headR, age, monster);

    // eyes
    const eyeR = geo.headR * 0.118;
    const eyeY = headY - geo.headR * 0.07;
    drawEye(g, headX - geo.headR * 0.33, eyeY, eyeR * 0.94, blink, mood, monster);
    drawEye(g, headX + geo.headR * 0.36, eyeY - geo.headR * 0.02, eyeR, blink, mood, monster);

    // soft cheek
    if (!monster) {
      g.save();
      g.globalAlpha = 0.13;
      const cheek = g.createRadialGradient(headX - geo.headR * 0.54, headY + geo.headR * 0.27, 1, headX - geo.headR * 0.54, headY + geo.headR * 0.27, geo.headR * 0.27);
      cheek.addColorStop(0, '#e68a70');
      cheek.addColorStop(1, 'rgba(230,138,112,0)');
      g.fillStyle = cheek;
      g.fillRect(headX - geo.headR, headY, geo.headR * 2, geo.headR);
      g.restore();
    }

    // beak
    const open = mood === 'eating' ? 0.34 + Math.abs(Math.sin(t * 15)) * 0.36 : 0;
    drawBeak(g, headX + geo.headR * 0.52, headY + geo.headR * 0.2, geo.headR * 0.82, open, monster);

    // near leg
    drawFoot(g, geo.rx * 0.27, 0, true, t, mood);

    // tiny feather highlight on the chest
    if (!monster) {
      g.strokeStyle = 'rgba(255,251,229,0.34)';
      g.lineWidth = 1.1;
      g.lineCap = 'round';
      g.beginPath();
      g.moveTo(-geo.rx * 0.18, geo.bodyCY + geo.ry * 0.4);
      g.quadraticCurveTo(-geo.rx * 0.3, geo.bodyCY + geo.ry * 0.2, -geo.rx * 0.12, geo.bodyCY + geo.ry * 0.06);
      g.stroke();
    }

    // monster extra eyes
    if (monster) {
      drawEye(g, headX - geo.headR * 0.74, headY + geo.headR * 0.2, eyeR * 0.62, 0, mood, true);
      drawEye(g, headX + geo.headR * 0.81, headY + geo.headR * 0.22, eyeR * 0.55, 0, mood, true);
    }

    g.restore();
  }

  function drawChickShadow(g, state) {
    const geo = getChickGeometry(state.weight);
    const flying = state.flying;
    let scale = 1;
    let alpha = 0.26;
    if (flying) {
      const p = clamp((state.phaseClock - state.flyStart) / 3200, 0, 1);
      scale = 1 - p * 0.6;
      alpha = 0.26 * (1 - p);
    }
    const grad = g.createRadialGradient(CHICK_X, CHICK_Y + 5, 2, CHICK_X, CHICK_Y + 5, geo.rx * 1.9 * CHICK_SCALE * scale);
    grad.addColorStop(0, `rgba(20,26,13,${alpha})`);
    grad.addColorStop(0.5, `rgba(20,26,13,${alpha * 0.54})`);
    grad.addColorStop(1, 'rgba(20,26,13,0)');
    g.fillStyle = grad;
    g.beginPath();
    g.ellipse(CHICK_X, CHICK_Y + 5, geo.rx * 1.9 * CHICK_SCALE * scale, 20 * scale, 0, 0, TAU);
    g.fill();
  }

  /* ─────────────────────────────────────────────────────────────
     grass, particles, knife
