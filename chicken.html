  function drawGrassClump(g, clump, now, hover) {
    const x = clump.x;
    const y = clump.y;
    const t = now / 1000;
    const s = clump.scale;
    const poison = clump.type === 'poison';

    if (clump.cut) {
      g.save();
      g.strokeStyle = poison ? 'rgba(94,74,106,0.5)' : 'rgba(100,119,53,0.5)';
      g.lineWidth = 2;
      g.lineCap = 'round';
      for (let i = 0; i < 5; i++) {
        const a = -1.7 + i * 0.42;
        g.beginPath();
        g.moveTo(x + i * 4 - 8, y);
        g.lineTo(x + i * 4 - 8 + Math.cos(a) * 7, y + Math.sin(a) * 7);
        g.stroke();
      }
      g.restore();
      return;
    }

    g.save();
    g.translate(x, y);
    g.scale(s, s);

    if (hover) {
      const glow = g.createRadialGradient(0, -34, 2, 0, -34, 68);
      glow.addColorStop(0, poison ? 'rgba(168,108,188,0.24)' : 'rgba(232,210,120,0.22)');
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = glow;
      g.beginPath();
      g.arc(0, -34, 68, 0, TAU);
      g.fill();
    }

    const n = poison ? 10 : 14;
    for (let i = 0; i < n; i++) {
      const r = mulberry32(clump.seed + i * 17);
      const bx = (r() - 0.5) * 44;
      const h = 48 + r() * 66;
      const wind = Math.sin(t * 1.05 + clump.phase + i * 0.44) * (4 + r() * 4);
      const lean = (r() - 0.5) * 0.55 + wind * 0.015;
      const w = 3.4 + r() * 2.7;
      const col = poison
        ? (r() > 0.5 ? '#6d597f' : '#564664')
        : (r() > 0.56 ? '#8fac4b' : '#61853a');
      g.fillStyle = col;
      g.beginPath();
      g.moveTo(bx - w / 2, 0);
      g.quadraticCurveTo(bx + lean * h * 0.45 - w * 0.4, -h * 0.54, bx + lean * h, -h);
      g.quadraticCurveTo(bx + lean * h * 0.45 + w * 0.5, -h * 0.54, bx + w / 2, 0);
      g.closePath();
      g.fill();

      if (!poison && r() > 0.54) {
        g.fillStyle = 'rgba(240,220,145,0.9)';
        ell(g, bx + lean * h, -h + 4, 2.8, 6.2, lean);
        g.fill();
        g.strokeStyle = 'rgba(218,192,112,0.55)';
        g.lineWidth = 0.8;
        g.beginPath();
        g.moveTo(bx + lean * h, -h + 8);
        g.lineTo(bx + lean * h - 1, -h + 15);
        g.stroke();
      }

      if (poison && r() > 0.42) {
        g.fillStyle = 'rgba(202,132,218,0.92)';
        g.beginPath();
        g.arc(bx + lean * h * 0.7 + (r() - 0.5) * 8, -h * (0.38 + r() * 0.36), 1.6 + r() * 2.5, 0, TAU);
        g.fill();
      }
    }

    // a faint collectible glow so the grass reads against the moss
    g.save();
    g.globalCompositeOperation = 'screen';
    const baseGlow = g.createRadialGradient(0, -8, 2, 0, -8, 54);
    baseGlow.addColorStop(0, poison ? 'rgba(146,88,168,0.16)' : 'rgba(220,201,112,0.14)');
    baseGlow.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = baseGlow;
    g.beginPath();
    g.ellipse(0, -8, 54, 24, 0, 0, TAU);
    g.fill();
    g.restore();

    g.restore();

    if (hover) {
      g.save();
      g.font = '600 22px "Microsoft YaHei", sans-serif';
      g.textAlign = 'center';
      const label = poison ? '紫斑草 · 有毒？' : '嫩草';
      g.fillStyle = 'rgba(5,10,6,0.8)';
      const tw = g.measureText(label).width;
      g.fillRect(x - tw / 2 - 13, y - 142, tw + 26, 34);
      g.fillStyle = poison ? '#e3b8ea' : '#ffe8a8';
      g.fillText(label, x, y - 118);
      g.strokeStyle = poison ? 'rgba(201,132,218,0.42)' : 'rgba(232,184,91,0.4)';
      g.lineWidth = 1;
      g.strokeRect(x - tw / 2 - 13, y - 142, tw + 26, 34);
      g.restore();
    }
  }

  function drawKnife(g, state, now) {
    if (!state.pointer || !state.pointer.active) return;
    const p = state.pointer;
    const t = now / 1000;
    const swing = state.slash || 0;
    const angle = p.angle + Math.sin(swing * Math.PI) * 0.95 - 0.1;
    const hover = state.hoverChick;

    g.save();
    g.translate(p.x, p.y);
    g.rotate(angle);

    // swing trail
    if (swing > 0.02 && swing < 0.98) {
      g.save();
      g.globalCompositeOperation = 'screen';
      const a = Math.sin(swing * Math.PI);
      g.strokeStyle = `rgba(255,236,186,${a * 0.34})`;
      g.lineWidth = 7;
      g.lineCap = 'round';
      g.beginPath();
      g.arc(36, 42, 112, -2.4, -0.6);
      g.stroke();
      g.strokeStyle = `rgba(255,255,240,${a * 0.18})`;
      g.lineWidth = 2;
      g.beginPath();
      g.arc(36, 42, 118, -2.35, -0.65);
      g.stroke();
      g.restore();
    }

    // blade glow when aimed at the chick
    if (hover) {
      g.save();
      g.globalCompositeOperation = 'screen';
      const glow = g.createRadialGradient(-74, 0, 1, -74, 0, 100);
      glow.addColorStop(0, 'rgba(255,92,58,0.24)');
      glow.addColorStop(1, 'rgba(255,92,58,0)');
      g.fillStyle = glow;
      g.fillRect(-180, -90, 220, 180);
      g.restore();
    }

    // handle
    const handle = g.createLinearGradient(10, -5, 52, 8);
    handle.addColorStop(0, '#2b2015');
    handle.addColorStop(0.5, '#6c4d2b');
    handle.addColorStop(1, '#251a11');
    g.fillStyle = handle;
    g.beginPath();
    g.roundRect(10, -7, 48, 16, 4);
    g.fill();
    g.strokeStyle = 'rgba(231,188,111,0.3)';
    g.lineWidth = 1;
    g.stroke();

    // rivets
    g.fillStyle = '#d8b36f';
    for (let i = 0; i < 3; i++) {
      g.beginPath();
      g.arc(20 + i * 13, 1, 1.4, 0, TAU);
      g.fill();
    }

    // bolster
    g.fillStyle = '#8b8b78';
    g.beginPath();
    g.roundRect(2, -9, 10, 20, 2);
    g.fill();

    // blade
    const blade = g.createLinearGradient(-90, -20, 4, 12);
    blade.addColorStop(0, '#f4f2df');
    blade.addColorStop(0.32, '#c9d4ca');
    blade.addColorStop(0.62, '#8a998f');
    blade.addColorStop(1, '#f5f2dd');
    g.fillStyle = blade;
    g.beginPath();
    g.moveTo(3, -8);
    g.lineTo(-82, -17);
    g.quadraticCurveTo(-98, -6, -90, 5);
    g.lineTo(3, 9);
    g.closePath();
    g.fill();

    // blade edge / spine
    g.strokeStyle = 'rgba(255,255,246,0.9)';
    g.lineWidth = 1.4;
    g.beginPath();
    g.moveTo(-4, 8.2);
    g.lineTo(-88, 4.4);
    g.stroke();
    g.strokeStyle = 'rgba(74,88,78,0.8)';
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(2, -7.2);
    g.lineTo(-84, -15.6);
    g.stroke();

    // glint
    g.save();
    g.globalCompositeOperation = 'screen';
    g.strokeStyle = `rgba(255,255,255,${0.3 + Math.sin(t * 5) * 0.08})`;
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(-30, -9);
    g.lineTo(-48, 4);
    g.stroke();
    g.restore();

    // hand
    const skin = g.createLinearGradient(48, -18, 88, 32);
    skin.addColorStop(0, '#d7a47b');
    skin.addColorStop(1, '#8d5b3c');
    g.fillStyle = skin;
    g.beginPath();
    g.moveTo(44, -14);
    g.bezierCurveTo(66, -23, 82, -7, 81, 9);
    g.bezierCurveTo(80, 24, 63, 30, 48, 21);
    g.bezierCurveTo(39, 15, 37, -4, 44, -14);
    g.closePath();
    g.fill();
    g.strokeStyle = 'rgba(78,42,24,0.55)';
    g.lineWidth = 1.2;
    g.beginPath();
    g.moveTo(49, -8);
    g.quadraticCurveTo(60, -2, 60, 10);
    g.moveTo(55, -12);
    g.quadraticCurveTo(67, -5, 66, 9);
    g.stroke();

    // fingers curled around the handle
    g.save();
    for (let i = 0; i < 4; i++) {
      const fx = 49 + i * 4.4;
      const fy = -5 + i * 2.5;
      const fg = g.createLinearGradient(fx, fy - 5, fx, fy + 7);
      fg.addColorStop(0, '#d8a57b');
      fg.addColorStop(1, '#95613f');
      g.fillStyle = fg;
      g.beginPath();
      g.ellipse(fx, fy, 3.2, 6.2, -0.35 + i * 0.06, 0, TAU);
      g.fill();
      g.strokeStyle = 'rgba(83,44,24,0.46)';
      g.lineWidth = 0.8;
      g.stroke();
    }
    // thumb across the top of the grip
    g.fillStyle = '#c9946b';
    g.beginPath();
    g.ellipse(58, -11, 9, 4.4, -0.18, 0, TAU);
    g.fill();
    g.strokeStyle = 'rgba(83,44,24,0.38)';
    g.stroke();
    g.restore();

    // sleeve cuff
    g.fillStyle = '#2b3b27';
    g.beginPath();
    g.moveTo(68, 12);
    g.quadraticCurveTo(100, 24, 125, 54);
    g.lineTo(96, 76);
    g.quadraticCurveTo(78, 40, 64, 26);
    g.closePath();
    g.fill();
    g.strokeStyle = 'rgba(232,184,91,0.22)';
    g.stroke();

    g.restore();
  }

  /* ─────────────────────────────────────────────────────────────
     dynamic scene

  const fireflies = (() => {
    const r = mulberry32(7001);
    return Array.from({ length: 34 }, () => ({
      x: 70 + r() * 1460,
      y: 320 + r() * 500,
      phase: r() * TAU,
      speed: 0.3 + r() * 0.6,
      size: 1 + r() * 2.6,
      drift: 14 + r() * 36
    }));
  })();

  const fallingLeaves = (() => {
    const r = mulberry32(8011);
    return Array.from({ length: 13 }, () => ({
      x: r() * W,
      y: r() * H,
      speed: 7 + r() * 17,
      phase: r() * TAU,
      size: 3 + r() * 7,
      rot: r() * TAU,
      spin: (r() - 0.5) * 1.2
    }));
  })();

  function drawRays(g, t) {
    g.save();
    g.globalCompositeOperation = 'screen';
    const rays = [
      { x: 1190, w: 120, a: 0.06, p: 0.3 },
      { x: 1280, w: 230, a: 0.045, p: 1.1 },
      { x: 1090, w: 86, a: 0.038, p: 2.2 },
      { x: 1350, w: 150, a: 0.03, p: 3.1 }
    ];
    for (let i = 0; i < rays.length; i++) {
      const r = rays[i];
      const alpha = r.a * (0.75 + Math.sin(t * 0.45 + r.p) * 0.25);
      const grad = g.createLinearGradient(r.x, 0, r.x - 280, 820);
      grad.addColorStop(0, `rgba(255,240,183,${alpha})`);
      grad.addColorStop(0.6, `rgba(255,228,155,${alpha * 0.42})`);
      grad.addColorStop(1, 'rgba(255,220,140,0)');
      g.fillStyle = grad;
      g.beginPath();
      g.moveTo(r.x - r.w * 0.25, -20);
      g.lineTo(r.x + r.w * 0.25, -20);
      g.lineTo(r.x - 210 + r.w, 830);
      g.lineTo(r.x - 290 - r.w * 0.4, 830);
      g.closePath();
      g.fill();
    }
    g.restore();
  }

  function drawFireflies(g, t) {
    g.save();
    g.globalCompositeOperation = 'screen';
    for (let i = 0; i < fireflies.length; i++) {
      const f = fireflies[i];
      const x = f.x + Math.sin(t * f.speed + f.phase) * f.drift;
      const y = f.y + Math.cos(t * f.speed * 0.7 + f.phase * 1.3) * f.drift * 0.5;
      const pulse = 0.35 + (Math.sin(t * 1.6 + f.phase) * 0.5 + 0.5) * 0.65;
      const glow = g.createRadialGradient(x, y, 0, x, y, f.size * 9);
      glow.addColorStop(0, `rgba(255,239,166,${0.72 * pulse})`);
      glow.addColorStop(0.3, `rgba(255,219,124,${0.26 * pulse})`);
      glow.addColorStop(1, 'rgba(255,210,100,0)');
      g.fillStyle = glow;
      g.beginPath();
      g.arc(x, y, f.size * 9, 0, TAU);
      g.fill();
      g.fillStyle = `rgba(255,248,205,${0.8 * pulse})`;
      g.beginPath();
      g.arc(x, y, f.size * 0.75, 0, TAU);
      g.fill();
    }
    g.restore();
  }

  function drawLeaves(g, t) {
    g.save();
    for (let i = 0; i < fallingLeaves.length; i++) {
      const l = fallingLeaves[i];
      const y = ((l.y + t * l.speed) % (H + 80)) - 40;
      const x = l.x + Math.sin(t * 0.48 + l.phase) * 34;
      const rot = l.rot + t * l.spin;
      g.save();
      g.translate(x, y);
      g.rotate(rot);
      g.fillStyle = i % 3 === 0 ? 'rgba(188,149,67,0.4)' : 'rgba(115,130,67,0.32)';
      g.beginPath();
      g.ellipse(0, 0, l.size, l.size * 0.32, 0, 0, TAU);
      g.fill();
      g.strokeStyle = 'rgba(60,70,36,0.25)';
      g.lineWidth = 0.7;
      g.beginPath();
      g.moveTo(-l.size, 0);
      g.lineTo(l.size, 0);
      g.stroke();
      g.restore();
    }
    g.restore();
  }

  function drawParticles(g, state) {
    const ps = state.particles || [];
    for (let i = 0; i < ps.length; i++) {
      const p = ps[i];
      const k = clamp(p.life / p.maxLife, 0, 1);
      g.save();
      g.globalAlpha = k * (p.alpha == null ? 1 : p.alpha);
      g.fillStyle = p.color;
      if (p.type === 'blade') {
        g.translate(p.x, p.y);
        g.rotate(p.rot + p.life * 0.02);
        g.beginPath();
        g.ellipse(0, 0, p.size, p.size * 0.32, 0, 0, TAU);
        g.fill();
      } else if (p.type === 'feather') {
        g.translate(p.x, p.y);
        g.rotate(p.rot + Math.sin(p.life * 0.005) * 0.4);
        g.beginPath();
        g.moveTo(-p.size, 0);
        g.quadraticCurveTo(0, -p.size * 0.7, p.size, 0);
        g.quadraticCurveTo(0, p.size * 0.35, -p.size, 0);
        g.fill();
      } else {
        g.beginPath();
        g.arc(p.x, p.y, p.size * k, 0, TAU);
        g.fill();
      }
      g.restore();
    }
  }

  function drawFloatingText(g, state) {
    const arr = state.floatTexts || [];
    for (let i = 0; i < arr.length; i++) {
      const f = arr[i];
      const k = clamp(f.life / f.maxLife, 0, 1);
      g.save();
      g.globalAlpha = k;
      g.font = `600 ${f.size || 24}px "Microsoft YaHei", sans-serif`;
      g.textAlign = 'center';
      g.fillStyle = f.color || '#ffe8a8';
      g.shadowColor = 'rgba(0,0,0,0.75)';
      g.shadowBlur = 8;
      g.fillText(f.text, f.x, f.y);
      g.restore();
    }
  }

  function drawDrumstick(g, state, now) {
    const t = now / 1000;
    const x = CHICK_X;
    const y = CHICK_Y - 32;
    g.save();

    // plate
    g.fillStyle = 'rgba(20,27,19,0.3)';
    ell(g, x, y + 55, 175, 28, 0);
    g.fill();
    const plate = g.createRadialGradient(x - 25, y + 20, 5, x, y + 40, 175);
    plate.addColorStop(0, '#efe6cb');
    plate.addColorStop(0.65, '#c9bea2');
    plate.addColorStop(1, '#7e765f');
    g.fillStyle = plate;
    ell(g, x, y + 46, 166, 27, 0);
    g.fill();
    g.strokeStyle = 'rgba(255,249,218,0.5)';
    g.lineWidth = 2;
    ell(g, x, y + 44, 152, 22, 0);
    g.stroke();

    // steam
    g.save();
    g.globalCompositeOperation = 'screen';
    g.strokeStyle = 'rgba(255,246,212,0.22)';
    g.lineWidth = 6;
    g.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      g.beginPath();
      g.moveTo(x - 38 + i * 40, y - 26);
      g.bezierCurveTo(x - 48 + i * 40 + Math.sin(t + i) * 14, y - 68, x - 22 + i * 40, y - 82, x - 32 + i * 40 + Math.sin(t + i + 1) * 12, y - 120);
      g.stroke();
    }
    g.restore();

    // meat
    g.save();
    g.translate(x, y);
    g.rotate(-0.32);
    const meat = g.createRadialGradient(-18, -12, 4, 0, 0, 94);
    meat.addColorStop(0, '#f6c36e');
    meat.addColorStop(0.36, '#d98f3b');
    meat.addColorStop(0.74, '#9d5722');
    meat.addColorStop(1, '#5a2c13');
    g.fillStyle = meat;
    g.beginPath();
    g.ellipse(-12, 0, 78, 48, 0, 0, TAU);
    g.fill();
    g.strokeStyle = 'rgba(255,214,140,0.36)';
    g.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
      g.beginPath();
      g.arc(-40 + i * 18, -2, 17, -1.1, 1.1);
      g.stroke();
    }
    // bone
    g.strokeStyle = '#f2ead5';
    g.lineWidth = 19;
    g.lineCap = 'round';
    g.beginPath();
    g.moveTo(48, 10);
    g.lineTo(106, 32);
    g.stroke();
    g.strokeStyle = '#cfc3a6';
    g.lineWidth = 7;
    g.beginPath();
    g.moveTo(52, 11);
    g.lineTo(101, 30);
    g.stroke();
    g.fillStyle = '#f6efdd';
    g.beginPath();
    g.arc(108, 30, 11, 0, TAU);
    g.arc(116, 38, 9, 0, TAU);
    g.fill();
    g.restore();

    // feather
    g.save();
    g.translate(x - 128, y + 22);
    g.rotate(0.5);
    g.fillStyle = 'rgba(250,239,201,0.78)';
    g.beginPath();
    g.moveTo(-16, 0);
    g.quadraticCurveTo(0, -12, 24, 0);
    g.quadraticCurveTo(0, 7, -16, 0);
    g.fill();
    g.restore();

    g.restore();
  }

  function drawScene(ctx, state, now) {
    ctx.clearRect(0, 0, W, H);
    const t = now / 1000;
    const p = state.pointer || { x: W * 0.76, y: H * 0.7 };
    const px = clamp(p.x / W - 0.5, -0.5, 0.5);
    const py = clamp(p.y / H - 0.5, -0.5, 0.5);

    if (!bgCanvas) buildBackground();
    ctx.drawImage(bgCanvas, -12 + px * 8, -8 + py * 6, W + 24, H + 16);

    drawRays(ctx, t);
    drawFireflies(ctx, t);
    drawLeaves(ctx, t);

    // grass clumps
    if (state.grass) {
      for (let i = 0; i < state.grass.length; i++) {
        const c = state.grass[i];
        drawGrassClump(ctx, c, now, state.hoverGrass === c);
      }
    }

    if (state.chickVisible !== false) {
      drawChickShadow(ctx, state);
      drawChick(ctx, state, now);
    }

    if (state.leg) drawDrumstick(ctx, state, now);

    drawParticles(ctx, state);
    drawFloatingText(ctx, state);

    if (state.showKnife !== false && (state.phase === 'play' || state.phase === 'cinematic' || state.phase === 'title')) {
      drawKnife(ctx, state, now);
    }

    // nightmare overlay for the monster ending lead-in
    if (state.monster && state.phase === 'cinematic') {
      ctx.save();
      ctx.fillStyle = 'rgba(2,3,2,0.68)';
      ctx.fillRect(0, 0, W, H);
      const glow = ctx.createRadialGradient(W / 2, 430, 8, W / 2, 430, 380);
      glow.addColorStop(0, 'rgba(126,18,10,0.26)');
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ff4a28';
      ctx.globalAlpha = 0.26 + Math.sin(t * 3) * 0.08;
      ctx.beginPath();
      ctx.arc(730, 420, 18, 0, TAU);
      ctx.arc(870, 414, 18, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
  }

  function prep(canvas, w, h) {
    canvas.width = w;
    canvas.height = h;
    const g = canvas.getContext('2d');
    g.clearRect(0, 0, w, h);
    return g;
  }

  function drawChickenHead(g, cx, cy, r, palette) {
    // body hint
    g.fillStyle = palette.body;
    ell(g, cx, cy + r * 1.42, r * 1.15, r * 0.92, 0);
    g.fill();
    // head
    const hg = g.createRadialGradient(cx - r * 0.35, cy - r * 0.42, 2, cx, cy, r * 1.2);
    hg.addColorStop(0, palette.light);
    hg.addColorStop(0.52, palette.mid);
    hg.addColorStop(1, palette.dark);
    g.fillStyle = hg;
    ell(g, cx, cy, r, r * 1.03, 0);
    g.fill();
    // fluff
    g.strokeStyle = 'rgba(255,248,220,0.3)';
    g.lineWidth = 1;
    g.lineCap = 'round';
    const rr = mulberry32(333);
    for (let i = 0; i < 46; i++) {
      const a = rr() * TAU;
      const rad = Math.sqrt(rr()) * 0.9;
      const x = cx + Math.cos(a) * r * rad;
      const y = cy + Math.sin(a) * r * 0.95 * rad;
      g.beginPath();
      g.moveTo(x, y);
      g.lineTo(x + Math.cos(a) * (4 + rr() * 5), y + Math.sin(a) * (3 + rr() * 5));
      g.stroke();
    }
    // eyes
    g.fillStyle = '#211006';
    g.beginPath();
    g.arc(cx - r * 0.34, cy - r * 0.05, r * 0.12, 0, TAU);
    g.arc(cx + r * 0.34, cy - r * 0.05, r * 0.12, 0, TAU);
    g.fill();
    g.fillStyle = '#fffdf4';
    g.beginPath();
    g.arc(cx - r * 0.38, cy - r * 0.1, r * 0.045, 0, TAU);
    g.arc(cx + r * 0.3, cy - r * 0.1, r * 0.045, 0, TAU);
    g.fill();
    // beak
    g.fillStyle = '#e7a03b';
    g.beginPath();
    g.moveTo(cx - r * 0.07, cy + r * 0.22);
    g.quadraticCurveTo(cx + r * 0.42, cy + r * 0.2, cx + r * 0.48, cy + r * 0.33);
    g.quadraticCurveTo(cx + r * 0.18, cy + r * 0.45, cx - r * 0.06, cy + r * 0.35);
    g.closePath();
    g.fill();
    // comb
    g.fillStyle = '#c95b4b';
    g.beginPath();
    g.moveTo(cx - r * 0.22, cy - r * 0.92);
    g.quadraticCurveTo(cx - r * 0.18, cy - r * 1.24, cx - r * 0.02, cy - r * 0.98);
    g.quadraticCurveTo(cx + r * 0.1, cy - r * 1.28, cx + r * 0.18, cy - r * 0.95);
    g.quadraticCurveTo(cx + r * 0.3, cy - r * 1.06, cx + r * 0.28, cy - r * 0.8);
    g.closePath();
    g.fill();
  }

    } else if (key === 'toad') {
      // body
      const grad = g.createRadialGradient(118, 126, 4, 150, 164, 102);
      grad.addColorStop(0, '#a3b35c');

  function drawHybrid(canvas, key, mutation = 0) {
    const g = prep(canvas, 760, 520);
    // vignette
    const bg = g.createRadialGradient(380, 240, 20, 380, 260, 380);
    bg.addColorStop(0, 'rgba(91,109,59,0.28)');
    bg.addColorStop(1, 'rgba(9,15,10,0)');
    g.fillStyle = bg;
    g.fillRect(0, 0, 760, 520);

    if (key === 'toad') {
      // shadow
      g.fillStyle = 'rgba(0,0,0,0.25)';
      ell(g, 380, 430, 160, 32, 0);
      g.fill();
      // body
      const body = g.createRadialGradient(330, 240, 12, 380, 290, 200);
      body.addColorStop(0, '#c7bd73');
      body.addColorStop(0.45, '#9b9d4c');
      body.addColorStop(0.78, '#5f7337');
      body.addColorStop(1, '#2c3a21');
      g.fillStyle = body;
      g.beginPath();
      g.moveTo(380, 130);
      g.bezierCurveTo(540, 136, 568, 322, 486, 398);
      g.bezierCurveTo(438, 440, 310, 438, 266, 392);
      g.bezierCurveTo(190, 308, 227, 142, 380, 130);
      g.fill();
      // wings
      g.fillStyle = '#8a8d44';
      g.beginPath();
      g.moveTo(248, 250);
      g.bezierCurveTo(174, 210, 126, 300, 190, 348);
      g.bezierCurveTo(222, 370, 260, 330, 274, 300);
      g.closePath();
      g.fill();
      g.fillStyle = '#757b3a';
      g.beginPath();
      g.moveTo(514, 250);
      g.bezierCurveTo(588, 212, 634, 304, 568, 350);
      g.bezierCurveTo(538, 370, 502, 330, 488, 300);
      g.closePath();
      g.fill();
      // head mass
      g.fillStyle = '#a5a557';
      ell(g, 382, 204, 94, 84, 0);
      g.fill();
      // eye bumps: three
      const spots = [[342, 164, 30], [424, 158, 26], [382, 124, 18]];
      for (const s of spots) {
        g.fillStyle = '#798943';
        g.beginPath();
        g.arc(s[0], s[1], s[2], 0, TAU);
        g.fill();
        g.fillStyle = '#ecd56e';
        g.beginPath();
        g.arc(s[0], s[1], s[2] * 0.68, 0, TAU);
        g.fill();
        g.fillStyle = '#161b0c';
        g.beginPath();
        g.ellipse(s[0], s[1], s[2] * 0.2, s[2] * 0.55, 0, 0, TAU);
        g.fill();
      }
      // beak / mouth
      g.fillStyle = '#a56a2d';
      g.beginPath();
      g.moveTo(334, 236);
      g.quadraticCurveTo(382, 260, 432, 232);
      g.quadraticCurveTo(384, 306, 334, 236);
      g.fill();
      // warts
      const rr = mulberry32(119);
      for (let i = 0; i < 60; i++) {
        const a = rr() * TAU;
        const rad = Math.sqrt(rr()) * 0.85;
        const x = 380 + Math.cos(a) * 150 * rad;
        const y = 280 + Math.sin(a) * 130 * rad;
        g.fillStyle = 'rgba(48,62,30,0.75)';
        g.beginPath();
        g.arc(x, y, 2.5 + rr() * 6, 0, TAU);
        g.fill();
      }
      // wrong little feathers
      g.strokeStyle = 'rgba(238,221,159,0.24)';
      g.lineWidth = 1.5;
      for (let i = 0; i < 50; i++) {
        const a = rr() * TAU;
        const x = 380 + Math.cos(a) * (148 + rr() * 25);
        const y = 300 + Math.sin(a) * (130 + rr() * 20);
        g.beginPath();
        g.moveTo(x, y);
        g.lineTo(x + Math.cos(a) * 12, y + Math.sin(a) * 9);
        g.stroke();
      }
      // drool
      g.strokeStyle = 'rgba(220,236,166,0.36)';
      g.lineWidth = 2;
      g.beginPath();
      g.moveTo(410, 286);
      g.quadraticCurveTo(420, 330, 404, 366);
      g.stroke();
      return;
    }

    const isFox = key === 'fox';
    // shadow
    g.fillStyle = 'rgba(0,0,0,0.24)';
    ell(g, 380, 432, 158, 28, 0);
    g.fill();

    // tail / ears behind
    if (isFox) {
      g.fillStyle = '#c66b2c';
      g.beginPath();
      g.moveTo(260, 330);
      g.bezierCurveTo(160, 292, 116, 352, 150, 396);
      g.bezierCurveTo(188, 434, 258, 400, 286, 360);
      g.fill();
      g.fillStyle = '#f2dfbb';
      g.beginPath();
      g.moveTo(158, 366);
      g.bezierCurveTo(140, 388, 156, 414, 182, 416);
      g.bezierCurveTo(172, 394, 176, 378, 190, 364);

    // body
    const body = g.createRadialGradient(326, 248, 10, 380, 300, 200);
    body.addColorStop(0, isFox ? '#f7d190' : '#fbf2d0');
    body.addColorStop(0.45, isFox ? '#e0a355' : '#f0d290');
    body.addColorStop(0.82, isFox ? '#a75b28' : '#c99447');
    body.addColorStop(1, isFox ? '#663119' : '#7d5224');
    g.fillStyle = body;
    ell(g, 380, 292, 145, 151, 0);
    g.fill();

    // long ears for rabbit hybrid
    if (!isFox) {
      g.fillStyle = '#f0e7d3';
      g.beginPath();
      g.ellipse(334, 88, 32, 96, -0.09, 0, TAU);
      g.ellipse(438, 88, 32, 96, 0.09, 0, TAU);

      g.strokeStyle = 'rgba(190,130,125,0.5)';

      g.beginPath();
      g.ellipse(334, 90, 17, 74, -0.09, 0, TAU);
      g.ellipse(438, 90, 17, 74, 0.09, 0, TAU);
      g.stroke();
    } else {

      g.fillStyle = '#c96e30';
      g.beginPath();
      g.moveTo(302, 188);
      g.lineTo(286, 104);
      g.lineTo(354, 162);
      g.closePath();
      g.moveTo(458, 188);
      g.lineTo(476, 104);
      g.lineTo(408, 162);
      g.closePath();
      g.fill();
      g.fillStyle = '#47261a';
      g.beginPath();
      g.moveTo(300, 127);
      g.lineTo(315, 168);
      g.lineTo(336, 168);
      g.closePath();
      g.moveTo(460, 127);
      g.lineTo(445, 168);
      g.lineTo(424, 168);
      g.closePath();
      g.fill();
    }

    // head
    const head = g.createRadialGradient(330, 178, 10, 380, 210, 140);
    head.addColorStop(0, '#fffbe9');
    head.addColorStop(0.62, isFox ? '#f0c17c' : '#f8e9bb');
    head.addColorStop(1, isFox ? '#bc7033' : '#d5a354');
    g.fillStyle = head;
    ell(g, 384, 212, 108, 100, 0);
    g.fill();

    // wings
    const wing = g.createLinearGradient(220, 280, 290, 390);
    wing.addColorStop(0, isFox ? '#df9a4f' : '#efd8a0');
    wing.addColorStop(1, isFox ? '#9f5425' : '#b9853f');
    g.fillStyle = wing;
    g.beginPath();
    g.moveTo(254, 276);
    g.bezierCurveTo(200, 292, 204, 388, 274, 390);
    g.bezierCurveTo(300, 370, 296, 318, 254, 276);
    g.fill();
    g.beginPath();
    g.moveTo(504, 278);
    g.bezierCurveTo(558, 300, 552, 390, 482, 390);
    g.bezierCurveTo(458, 368, 460, 318, 504, 278);
    g.fill();

    // eyes
    const eyeY = 204;
    g.fillStyle = '#23150b';
    g.beginPath();
    g.arc(346, eyeY, 12, 0, TAU);
    g.arc(422, eyeY, 12, 0, TAU);
    g.fill();
    g.fillStyle = '#fffdf3';
    g.beginPath();
    g.arc(342, eyeY - 4, 4, 0, TAU);
    g.arc(418, eyeY - 4, 4, 0, TAU);
    g.fill();

    // beak
    const beakGrad = g.createLinearGradient(380, 226, 424, 252);
    beakGrad.addColorStop(0, '#f4b354');
    beakGrad.addColorStop(1, '#a75c1e');
    g.fillStyle = beakGrad;
    g.beginPath();
    g.moveTo(370, 230);
    g.quadraticCurveTo(414, 232, 438, 248);
    g.quadraticCurveTo(398, 276, 366, 252);
    g.closePath();
    g.fill();

    // comb
    g.fillStyle = isFox ? '#a9382c' : '#d16450';
    g.beginPath();
    g.moveTo(362, 128);
    g.quadraticCurveTo(378, 88, 394, 126);
    g.quadraticCurveTo(414, 94, 422, 132);
    g.quadraticCurveTo(436, 114, 438, 142);
    g.closePath();
    g.fill();

    // fluffy edge
    g.strokeStyle = 'rgba(255,250,227,0.3)';
    g.lineWidth = 1.2;
    const rr = mulberry32(4242);
    for (let i = 0; i < 90; i++) {
      const a = rr() * TAU;
      const x = 380 + Math.cos(a) * 150;
      const y = 292 + Math.sin(a) * 150;
      g.beginPath();
      g.moveTo(x, y);
      g.lineTo(x + Math.cos(a) * (7 + rr() * 9), y + Math.sin(a) * (6 + rr() * 8));
      g.stroke();
    }

    // inherited mutations from the family line
    if (mutation > 0) {
      const mr = mulberry32(700 + mutation * 31);
      if (mutation >= 2) {
        // a third eye opens on the forehead
        g.fillStyle = '#d8c875';
        g.beginPath();
        g.arc(384, 156, 10, 0, TAU);

      if (mutation >= 3) {

        for (const e of eyes) {

          g.fill();
          g.fillStyle = '#171408';
          g.beginPath();
          g.ellipse(e[0], e[1], e[2] * 0.22, e[2] * 0.62, 0, 0, TAU);
          g.fill();
          g.fillStyle = 'rgba(255,252,230,0.8)';
          g.beginPath();
          g.arc(e[0] - e[2] * 0.25, e[1] - e[2] * 0.28, e[2] * 0.16, 0, TAU);
          g.fill();

      if (mutation >= 4) {
        // eyes where there should be feathers
        const bodyEyes = [[302, 330, 8], [470, 328, 7]];
        for (const e of bodyEyes) {
          g.fillStyle = '#b9a65c';
          g.beginPath();
          g.arc(e[0], e[1], e[2], 0, TAU);
          g.fill();
          g.fillStyle = '#161208';
          g.beginPath();
          g.ellipse(e[0], e[1], e[2] * 0.24, e[2] * 0.6, 0, 0, TAU);

        }

        g.lineWidth = 2;
        g.beginPath();
        g.moveTo(410, 286);
        g.quadraticCurveTo(430, 330, 420, 370);

      }
      // warts and wrong little feathers
      for (let i = 0; i < 8 + mutation * 9; i++) {
        const a = mr() * TAU;
        const rad = Math.sqrt(mr()) * 0.82;
        const x = 380 + Math.cos(a) * 140 * rad;

        g.beginPath();
        g.arc(x, y, 1.4 + mr() * 3.4, 0, TAU);
        g.fill();
      }
    }
  }

  function loadUnlocked() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) return [];
      return parsed.filter((id) => ENDINGS[id]);
    } catch (e) {
      return [];
    }
  }

  const unlocked = new Set(loadUnlocked());

  function saveUnlocked() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(Array.from(unlocked)));
    } catch (e) { /* private mode */ }
  }

  function unlockEnding(id) {
    if (!unlocked.has(id)) {
      unlocked.add(id);
      saveUnlocked();
    }
    updateProgress();
  }

  function updateProgress() {
    const n = unlocked.size;
    const total = ENDING_ORDER.length;
    ui.titleProgress.textContent = `${n} / ${total}`;
    ui.endingProgress.textContent = `${n} / ${total}`;
    ui.archiveProgress.textContent = `已收录 ${n} / ${total} 个结局`;

  const AudioEngine = {
    ready: false,
    muted: false,
    ctx: null,
    master: null,
    windGain: null,
    birdTimer: 0,

    init() {
      if (this.ready) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = this.muted ? 0 : 0.55;
        this.master.connect(this.ctx.destination);
        this.ready = true;
        this.makeWind();
        this.scheduleBird();
      } catch (e) {
        this.ready = false;
      }
    },

    noise(duration) {
      const len = Math.max(1, Math.floor(this.ctx.sampleRate * duration));
      const buffer = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      return buffer;
    },

    makeWind() {
      if (!this.ready) return;
      const src = this.ctx.createBufferSource();
      src.buffer = this.noise(3);
      src.loop = true;
      const filter = this.ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 360;
      filter.Q.value = 0.5;
      const gain = this.ctx.createGain();
      gain.gain.value = 0.036;
      src.connect(filter);
      filter.connect(gain);
      gain.connect(this.master);
      src.start();
      this.windGain = gain;
    },

    scheduleBird() {
      if (this.birdTimer) clearTimeout(this.birdTimer);
      this.birdTimer = setTimeout(() => {
        if (this.ready && !this.muted && state.phase !== 'ending') this.bird();
        this.scheduleBird();
      }, 5500 + Math.random() * 7000);
    },

    bird() {
      if (!this.ready || this.muted) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      const base = 1500 + Math.random() * 1200;
      osc.frequency.setValueAtTime(base, now);
      osc.frequency.exponentialRampToValueAtTime(base * (1.35 + Math.random() * 0.35), now + 0.08);
      osc.frequency.exponentialRampToValueAtTime(base * 0.9, now + 0.17);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.028, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);
      osc.connect(gain);
      gain.connect(this.master);
      osc.start(now);
      osc.stop(now + 0.24);
    },

    tone(freq, dur, type, vol, slideTo, when) {
      if (!this.ready) return;
      const t0 = this.ctx.currentTime + (when || 0);
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(vol || 0.06, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain);
      gain.connect(this.master);
      osc.start(t0);
      osc.stop(t0 + dur + 0.03);
    },

    noiseHit(dur, freq, vol, type) {
      if (!this.ready) return;
      const src = this.ctx.createBufferSource();
      src.buffer = this.noise(dur);
      const f = this.ctx.createBiquadFilter();
      f.type = type || 'highpass';
      f.frequency.value = freq || 900;
      const gain = this.ctx.createGain();
      const t0 = this.ctx.currentTime;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(vol || 0.12, t0 + 0.011);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(f);
      f.connect(gain);
      gain.connect(this.master);
      src.start(t0);
    },

    sfx(name) {
      if (!this.ready || this.muted) return;
      switch (name) {
        case 'ui':
          this.tone(520, 0.06, 'sine', 0.025);
          break;
        case 'cut':
          this.noiseHit(0.15, 2200, 0.11, 'highpass');
          this.tone(280, 0.08, 'triangle', 0.025, 170);
          break;
        case 'slice':
          this.noiseHit(0.25, 1300, 0.18, 'highpass');
          this.tone(160, 0.36, 'sawtooth', 0.09, 48);
          break;
        case 'feed':
          this.tone(680, 0.08, 'sine', 0.045, 420);
          this.tone(940, 0.06, 'sine', 0.025, 700, 0.09);
          break;
        case 'grow':
          this.tone(320, 0.12, 'triangle', 0.04, 520);
          this.tone(520, 0.16, 'sine', 0.025, 780, 0.08);
          break;
        case 'poison':
          this.tone(220, 0.85, 'sawtooth', 0.06, 58);
          this.tone(233, 0.8, 'square', 0.018, 61);
          this.noiseHit(0.5, 280, 0.04, 'lowpass');
          break;
        case 'fly':
          this.tone(220, 0.9, 'sine', 0.055, 1500);
          this.tone(330, 0.9, 'triangle', 0.03, 2100, 0.12);
          break;
        case 'fire':
          this.noiseHit(0.9, 360, 0.045, 'lowpass');
          break;
        case 'vomit':
          this.noiseHit(0.7, 250, 0.08, 'lowpass');
          this.tone(90, 0.9, 'sawtooth', 0.05, 40);
          break;
        case 'bad':
          this.tone(110, 1.5, 'sine', 0.09, 38);
          this.tone(164, 1.1, 'triangle', 0.025, 45, 0.08);
          break;
        case 'good':
          [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
            this.tone(f, 0.7, 'sine', 0.045, null, i * 0.18);
          });
          break;
        case 'warning':
          this.tone(330, 0.22, 'triangle', 0.04, 220);
          break;
        default:
          break;
      }
    },

    toggle() {
      if (!this.ready) this.init();
      this.muted = !this.muted;
      if (this.master) {
        this.master.gain.setTargetAtTime(this.muted ? 0 : 0.55, this.ctx.currentTime, 0.05);
      }
      ui.soundBtn.classList.toggle('is-muted', this.muted);
      if (!this.muted) this.sfx('ui');
    }
  };

  function addParticle(p) {
    if (state.particles.length > 260) state.particles.shift();
    state.particles.push(p);

  function burstCut(clump) {
    const poison = clump.type === 'poison';
    for (let i = 0; i < 18; i++) {
      const a = -Math.PI * 0.85 + Math.random() * Math.PI * 1.2;
      const sp = 80 + Math.random() * 190;
      addParticle({
        x: clump.x + (Math.random() - 0.5) * 30,
        y: clump.y - 24 - Math.random() * 50,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 40,
        g: 280,
        life: 650 + Math.random() * 500,
        maxLife: 1150,
        size: 3 + Math.random() * 7,
        rot: Math.random() * TAU,
        color: poison ? (i % 2 ? '#8a68a2' : '#b48bc8') : (i % 2 ? '#78983d' : '#b3c86a'),
        type: 'blade',
        alpha: 0.9
      });
    }
  }

  function addFloat(text, x, y, color, size) {
    if (state.floatTexts.length > 22) state.floatTexts.shift();

  function updateParticles(dt) {
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.life -= dt * 1000;
      if (p.life <= 0) {
        state.particles.splice(i, 1);
        continue;
      }
      p.vy += (p.g || 0) * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.992;
    }
    for (let i = state.floatTexts.length - 1; i >= 0; i--) {
      const f = state.floatTexts[i];
      f.life -= dt * 1000;
      f.y -= dt * 35;
      if (f.life <= 0) state.floatTexts.splice(i, 1);
    }
  }

  function grassAt(p) {
    for (let i = state.grass.length - 1; i >= 0; i--) {
      const c = state.grass[i];
      if (c.cut) continue;
      const dx = p.x - c.x;
      const dy = p.y - c.y;
      if (Math.abs(dx) < 50 * c.scale && dy > -112 * c.scale && dy < 22 * c.scale) return c;
    }
    return null;
  }

  function cutGrass(clump) {
    if (!clump || clump.cut) return;
    clump.cut = true;
    clump.regrowAt = performance.now() + REGROW_MS;
    if (clump.type === 'safe') state.safe += clump.amount;
    else state.poison += clump.amount;

    state.slashStart = performance.now();
    AudioEngine.sfx('cut');
    burstCut(clump);
    addFloat(
      clump.type === 'safe' ? `+${clump.amount} 嫩草` : `+${clump.amount} 紫斑草`,
      clump.x,
      clump.y - 120,
      clump.type === 'safe' ? '#dceca0' : '#dfb6ea',
      23
    );
    if (clump.type === 'poison') {
      showToast('紫斑草的汁液沾在刀上。你的指尖有点麻。');
    }
    updateHUD();
  }

  function regrowGrass(now) {
    for (const c of state.grass) {
      if (!c.cut) continue;
      if (now >= c.regrowAt) {
        c.cut = false;
        for (let i = 0; i < 8; i++) {
          addParticle({
            x: c.x + (Math.random() - 0.5) * 40,
            y: c.y - Math.random() * 20,
            vx: (Math.random() - 0.5) * 30,
            vy: -20 - Math.random() * 40,
            g: 100,
            life: 500 + Math.random() * 400,
            maxLife: 900,
            size: 2 + Math.random() * 3,
            color: c.type === 'poison' ? '#a782bd' : '#a9c25b',
            type: 'dot'
          });
        }
      }
    }
  }

  function stageOf(w) {
    if (w < GROWN_WEIGHT) return 0;
    if (w < 70) return 1;
    if (w < 90) return 2;
    if (w < FLY_WEIGHT) return 3;
    return 4;
  }

  function updateHUD() {
    const w = Math.round(state.weight);
    ui.weightNum.textContent = w;
    ui.weightFill.style.width = clamp(w, 0, 100) + '%';
    const s = stageOf(w);
    ui.stageLabel.textContent = STAGES[s].name;

    let hint = STAGES[s].hint;
    if (s === 0) hint = `再喂 ${Math.max(1, Math.ceil((GROWN_WEIGHT - w) / FEED_AMOUNT))} 顿就长大了`;
    if (s === 3) hint = '再喂下去，它可能会飞走';
    ui.stageHint.textContent = hint;

    ui.weightCard.classList.toggle('warn', s === 2 || s === 3);
    ui.weightCard.classList.toggle('danger', s >= 3);

    ui.safeCount.textContent = state.safe;
    ui.poisonCount.textContent = state.poison;
    const locked = state.phase !== 'play' || state.busy || state.modalOpen;
    ui.feedSafe.disabled = locked || state.safe <= 0;
    ui.feedPoison.disabled = locked || state.poison <= 0;

    if (state.phase === 'play') {
      if (s === 0) ui.objectiveText.textContent = '割些嫩草，喂给它。';
      else if (s === 1) ui.objectiveText.textContent = '它长大了。做出你的选择。';
      else if (s === 2) ui.objectiveText.textContent = '它已经成年。命运还在你手里。';
      else ui.objectiveText.textContent = '它太胖了。真的。';
    }

    ui.fateBtn.classList.toggle('is-hidden', !(state.phase === 'play' && w >= GROWN_WEIGHT));
  }

  function showToast(text, ms) {
    ui.toast.textContent = text;
    ui.toast.classList.add('show');
    if (state.toastTimer) clearTimeout(state.toastTimer);
    state.toastTimer = setTimeout(() => ui.toast.classList.remove('show'), ms || 2400);
  }

  function showDialogue(text, ms, speaker) {
    ui.dialogueText.textContent = text;
    const sp = ui.dialogue.querySelector('.speaker');
    if (sp) sp.textContent = speaker || '你';
    ui.dialogue.classList.remove('is-hidden');
    if (state.dialogueTimer) clearTimeout(state.dialogueTimer);
    if (ms !== 0) {
      state.dialogueTimer = setTimeout(() => {
        ui.dialogue.classList.add('is-hidden');
      }, ms || 4600);
    }
  }

  function hideDialogue() {
    if (state.dialogueTimer) clearTimeout(state.dialogueTimer);
    ui.dialogue.classList.add('is-hidden');
  }

  function showHud() {
    ui.hud.classList.remove('is-hidden');
  }

  function hideHud() {
    ui.hud.classList.add('is-hidden');
  }

  function flash(kind) {
    ui.flash.className = 'flash ' + (kind || '');
    void ui.flash.offsetWidth;
    ui.flash.classList.add('burst');
    setTimeout(() => ui.flash.classList.remove('burst'), 800);
  }

  function shake(hard) {
    ui.stage.classList.remove('shake', 'shake-hard');
    void ui.stage.offsetWidth;
    ui.stage.classList.add(hard ? 'shake-hard' : 'shake');
    setTimeout(() => ui.stage.classList.remove('shake', 'shake-hard'), hard ? 800 : 520);
  }

  /* ─────────────────────────────────────────────────────────────
     modal
     ───────────────────────────────────────────────────────────── */

  function openModal(opts) {
    state.modalOpen = true;
    state.modalLocked = opts.closable === false;
    ui.modal.classList.remove('is-hidden');
    ui.modalCard.className = 'modal-card ' + (opts.className || '');
    ui.modalKicker.textContent = opts.kicker || '';
    ui.modalTitle.innerHTML = opts.title || '';
    ui.modalBody.innerHTML = opts.body || '';
    ui.modalActions.innerHTML = '';
    ui.modalClose.style.display = opts.closable === false ? 'none' : '';

    if (opts.actions && opts.actions.length) {
      opts.actions.forEach((a) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = a.cls || 'ghost';
        const label = document.createElement('span');
        label.textContent = a.label;
        b.appendChild(label);
        if (a.note) {
          const note = document.createElement('span');
          note.className = 'choice-note';
          note.textContent = a.note;
          b.appendChild(note);
        }
        b.addEventListener('click', () => {
          AudioEngine.sfx('ui');
          if (a.onClick) a.onClick();
          else closeModal();
        });
        ui.modalActions.appendChild(b);
      });
    }

    ui.modalClose.onclick = () => {
      if (opts.closable === false) return;
      closeModal();
      if (opts.onClose) opts.onClose();
    };
    ui.modal.querySelector('.modal-backdrop').onclick = () => {
      if (opts.closable !== false) {
        closeModal();
        if (opts.onClose) opts.onClose();
      }
    };

    if (opts.onMount) {
      requestAnimationFrame(() => {
        try { opts.onMount(ui.modalBody); } catch (e) { /* noop */ }
      });
    }
    updateHUD();
  }

  function closeModal(force) {
    if (!state.modalOpen && !force) return;
    if (state.modalLocked && !force) return;
    state.modalOpen = false;
    state.modalLocked = false;
    ui.modal.classList.add('is-hidden');
    ui.modalBody.innerHTML = '';
    ui.modalActions.innerHTML = '';
    updateHUD();
  }

  /* ─────────────────────────────────────────────────────────────
     game flow
     ───────────────────────────────────────────────────────────── */

  function startGame(debug) {
    if (state.phase !== 'title') return;
    if (!debug) AudioEngine.init();
    state.phase = 'play';
    state.debug = !!debug;
    state.startedAt = performance.now();
    state.nextBlink = performance.now() + 1800;
    state.pointer.active = true;
    state.showKnife = true;
    state.chickVisible = true;

    ui.title.classList.add('is-hidden');
    ui.hud.classList.remove('is-hidden');
    if (debug) ui.title.style.display = 'none';
    else setTimeout(() => { ui.title.style.display = 'none'; }, 900);
    updateHUD();

    if (!debug) {
      showDialogue('草叶上有水。它歪头看你。刀在你手里。', 5400);
      setTimeout(() => showToast('点击草堆割草。别点那只鸡。'), 900);
      if (state.dangerTimer) clearTimeout(state.dangerTimer);
      state.dangerTimer = setTimeout(() => {
        if (state.phase === 'play') ui.dangerHint.classList.add('show');
      }, 11500);
      setTimeout(() => ui.dangerHint.classList.remove('show'), 22000);
      setTimeout(() => AudioEngine.sfx('warning'), 10600);
    }
  }

  function feed(type) {
    if (state.phase !== 'play' || state.modalOpen || state.busy) return;
    if (type === 'safe' && state.safe <= 0) {
      showToast('嫩草用完了。去割一些。');
      return;
    }
    if (type === 'poison' && state.poison <= 0) {
      showToast('没有紫斑草。');
      return;
    }

    if (type === 'safe') {
      state.safe -= 1;
      state.busy = true;
      state.chickMood = 'eating';
      state.peck = 1;
      AudioEngine.sfx('feed');
      burstFeed();
      updateHUD();
      hideDialogue();

      setTimeout(() => {
        if (state.phase !== 'play') return;
        const before = stageOf(state.weight);
        state.weight = Math.min(120, state.weight + FEED_AMOUNT);
        const after = stageOf(state.weight);
        state.chickMood = 'happy';
        state.peck = 0;
        updateHUD();
        addFloat(`+${FEED_AMOUNT}`, Art.CHICK_X + 145, Art.CHICK_Y - 320, '#ffe6a1', 28);
        AudioEngine.sfx('grow');

        if (state.weight >= FLY_WEIGHT) {
          state.busy = true;
          setTimeout(() => {
            if (state.phase === 'play') triggerFly();
          }, 850);
          return;
        }

        state.busy = false;
        if (after > before) handleStageUp(before, after);
        setTimeout(() => {
          if (state.phase === 'play') state.chickMood = 'idle';
        }, 1000);
        updateHUD();
      }, 780);
      return;
    }

    // poison
    state.poison -= 1;
    state.busy = true;
    state.chickMood = 'eating';
    state.peck = 1;
    AudioEngine.sfx('feed');
    updateHUD();
    showDialogue('它啄走了紫斑草。嚼了两下，停住了。', 2600);
    setTimeout(() => {
      if (state.phase !== 'play') return;
      state.chickMood = 'dead';
      state.peck = 0;
      burstPoison();
      AudioEngine.sfx('poison');
      flash('violet');
      shake(true);
      addFloat('好苦……', Art.CHICK_X, Art.CHICK_Y - 330, '#d9a9e4', 26);
      setTimeout(() => triggerPoison(), 1350);
    }, 840);
  }

  function handleStageUp(before, after) {
    if (before < 1 && after >= 1) {
      burstFeathers(18);
      addFloat('长大了', Art.CHICK_X, Art.CHICK_Y - 340, '#ffe8a8', 32);
      showToast('它褪去了绒毛，冠子红了。');
      showDialogue('它抽条了。羽毛一根根长出来，冠子红得像一颗小痣。', 5600);
      if (!state.stageModalSeen) {
        state.stageModalSeen = true;
        setTimeout(() => {
          if (state.phase === 'play' && !state.modalOpen) openStageModal();
        }, 1200);
      }
    } else if (after === 2) {
      showToast('成年了。它看你的眼神变了。');
      showDialogue('它不再躲你的刀。有时候，它甚至会盯着刀看。', 4800);
    } else if (after === 3) {
      showToast('它胖得看不见自己的脚了。');
      showDialogue('它走两步就要歇一会儿。你听见它的呼吸里有风箱的声音。', 4800);
    }
  }

  function openStageModal() {
    if (state.phase !== 'play') return;
    state.fateSeen = true;
    closeModal(true);
    openModal({
      kicker: 'THE CROSSROAD · 命运抉择',
      title: '它已经长大了。',
      body: `
        <p>它站在光里，冠子红得像一颗小痣。它不再用小鸡的眼神看你了。</p>
        <p>体重 <em>${Math.round(state.weight)} g?</em>。你手里还握着刀。</p>
        <p>现在，你得做点什么。</p>
      `,
      actions: [
        {
          label: '再养养',
          note: '继续喂草',
          cls: 'ghost',
          onClick: () => {
            closeModal();
            showDialogue('你决定再等等。它歪着头，像是早就知道。', 3600);
          }
        },
        {
          label: '放生',
          note: '让它回归森林',
          cls: 'primary',
          onClick: () => {
            closeModal();
            releaseChicken();
          }
        },
        {
          label: '处对象',
          note: '森林相亲角',
          cls: 'primary',
          onClick: () => {
            closeModal();
            setTimeout(openMateMenu, 160);
          }
        },
        {
          label: '拔刀',
          note: '不处对象，砍光它们',
          cls: 'danger-btn',
          onClick: () => {
            closeModal();
            triggerKillAll();
          }
        }
      ]
    });
  }

  function releaseChicken() {
    if (state.phase !== 'play') return;
    state.busy = true;
    state.chickVisible = false;
    state.showKnife = false;
    AudioEngine.sfx('fire');
    playCinematic([
      ['你抱起它，走向森林深处。', ''],
      ['你拾来干柴，生起一堆火。', ''],
      ['“放生。”你对自己说。', 'gold'],
      ['油脂滴进火里，发出很香的噼啪声。', 'dark']
    ], () => showEnding('roast'));
  }

  function openMateMenu() {
    if (state.phase !== 'play') return;
    closeModal(true);
    openModal({
      kicker: 'THE FOREST DATING CORNER',
      title: '森林相亲角',
      body: `
        <p>它到了想恋爱的年纪。森林里的动物都探出了头。</p>
        <p>你可以让小鸡和它们生一窝杂交宝宝，也可以——<em>自己上。</em></p>
        <div class="choice-grid" id="mateGrid"></div>
      `,
      actions: [
        {
          label: '再想想',
          cls: 'ghost',
          onClick: () => closeModal()
        }
      ],
      onMount: (body) => {
        const grid = body.querySelector('#mateGrid');
        if (!grid) return;
        ['chicken', 'rabbit', 'fox', 'toad'].forEach((key) => {
          const p = PARTNERS[key];
          const card = document.createElement('button');
          card.type = 'button';
          card.className = 'creature-card' + (key === 'toad' ? ' danger' : '');
          card.innerHTML = `
            <canvas width="300" height="250"></canvas>
            <span class="creature-meta">
              <b>${p.name}</b>
              <i>${p.risk}</i>
              <small>${p.note}</small>
            </span>
          `;
          card.addEventListener('click', () => {
            closeModal();
            setTimeout(() => openWhoModal(key), 150);
          });
          grid.appendChild(card);
          Art.drawPartner(card.querySelector('canvas'), key);
        });
      }
    });
  }

  function openWhoModal(key) {
    const p = PARTNERS[key];
    const actions = [];
    if (key !== 'chicken') {
      actions.push({
        label: '让小鸡去',
        note: '生一窝杂交宝宝',
        cls: 'primary',
        onClick: () => {
          closeModal();
          setTimeout(() => makeHybrid(key), 200);
        }
      });
    }
    actions.push({
      label: '我自己去',
      note: '它会进化成人类',
      cls: 'primary',
      onClick: () => {
        closeModal();
        setTimeout(() => evolvePartner(key), 220);
      }
    });
    actions.push({
      label: '算了',
      cls: 'ghost',
      onClick: () => closeModal()
    });

    openModal({
      kicker: 'CHOOSE THE ONE · 谁去',
      title: key === 'chicken' ? '你确定要和一只鸡处对象？' : `谁去和${p.name}处对象？`,
      body: `
        <div class="result-stage">
          <div class="result-portrait">
            <span class="scan-label">CANDIDATE</span>
            <canvas id="whoPortrait" width="300" height="250"></canvas>
          </div>
          <div class="result-copy">
            <div class="result-name"><b>${p.name}</b><small>${p.note}</small></div>
            <p class="result-desc">${p.line}</p>
            <p class="result-desc">${key === 'chicken' ? '没有别的选项。你只能自己上。' : '你可以让小鸡去，也可以自己走进那道光里。'}</p>
          </div>
        </div>
      `,
      actions,
      onMount: (body) => {
        const c = body.querySelector('#whoPortrait');
        if (c) Art.drawPartner(c, key);
      }
    });
  }

  function makeBaseChild(key) {
    const base = HYBRIDS[key];
    if (!base) return null;
    const parent = PARTNERS[key];
    return {
      ...base,
      baseKey: key,
      gen: 1,
      mutation: 0,
      lineage: ['小鸡', parent ? parent.name : '森林动物'],
      desc: base.desc
    };
  }

  function generationName(base, gen) {
    if (gen <= 1) return base.name;
    return `第${GEN_WORDS[Math.min(gen, 6) - 1]}代 · ${base.name}`;
  }

  function lineageLabel(lineage) {
    if (!lineage || !lineage.length) return '';
    if (lineage.length <= 4) return lineage.join(' × ');
    return `${lineage[0]} × … × ${lineage.slice(-2).join(' × ')}`;
  }

  function mutationLine(gen, ugly, baseKey) {
    if (ugly >= 70) {
      return '它已经不能被称为鸡了。它有很多眼睛，而且每一只都认识你。';
    }
    const trait = baseKey === 'fox' ? '尾巴' : '耳朵';
    if (gen === 2) return `它比上一代大了一圈。${trait}有一点不对称，但总体还像一只鸡。`;
    if (gen === 3) return '它已经有两个影子。你开始分不清它是在看你，还是在看你的刀。';
    return '它长出了多余的关节。它还是可爱的——至少在它不转头的时候。';
  }

  function buildNextChild(child, partnerKey) {
    const mate = MATE_STATS[partnerKey];
    const partner = PARTNERS[partnerKey];
    if (!mate) return null;
    const nextGen = Math.min(6, child.gen + 1);
    const inherited = child.ugly * 0.55 + mate.ugly * 0.45;
    const mutation = 10 + nextGen * 4 + Math.random() * 7;
    let ugly = Math.round(inherited + mutation);
    if (nextGen >= 5) ugly = Math.max(ugly, 82);
    ugly = clamp(ugly, 0, 100);
    const cute = clamp(Math.round(100 - ugly + (Math.random() * 6 - 3)), 0, 100);
    const base = HYBRIDS[child.baseKey] || HYBRIDS.rabbit;
    return {
      ...base,
      baseKey: child.baseKey,
      gen: nextGen,
      mutation: nextGen - 1,
      name: generationName(base, nextGen),
      tag: `GENERATION ${String(nextGen).padStart(2, '0')}`,
      cute,
      ugly,
      lineage: [...child.lineage, partner ? partner.name : '未知动物'],
      desc: mutationLine(nextGen, ugly, child.baseKey)
    };
  }

  function makeHybrid(key) {
    if (state.phase !== 'play') return;
    const h = makeBaseChild(key);
    if (!h) return;
    state.chickVisible = true;
    showToast('蛋壳裂开了。');
    setTimeout(() => {
      openHybridResult(key, h);
    }, 540);
  }

  function openHybridResult(key, data) {
    if (state.phase !== 'play') return;
    state.busy = false;
    const h = data || makeBaseChild(key);
    if (!h) return;
    const gen = h.gen || 1;
    const ugly = h.ugly >= 70;
    const lineage = lineageLabel(h.lineage);
    const sub = gen === 1
      ? `小鸡 × ${PARTNERS[key] ? PARTNERS[key].name : '森林动物'}`
      : `第 ${gen} 代 · ${lineage}`;
    const body = `
      <div class="result-stage">
        <div class="result-portrait">
          <span class="scan-label">${h.tag}</span>
          <canvas id="hybridPortrait" width="760" height="520"></canvas>
        </div>
        <div class="result-copy">
          <div class="result-name"><b>${h.name}</b><small>${sub}</small></div>
          <div class="stat-row"><span>可爱度</span><div class="stat-track"><i style="width:${h.cute}%"></i></div><span>${h.cute}</span></div>
          <div class="stat-row"><span>丑度</span><div class="stat-track ugly"><i style="width:${h.ugly}%"></i></div><span>${h.ugly}</span></div>
          <p class="result-desc">${h.desc}</p>
          ${ugly ? `<div class="result-warning">你的胃正在往上翻。你的手开始抖。你听见自己脑子里有什么东西“啪”地断掉了。${gen > 1 ? `<br>第 ${gen} 代已经不太像鸡了。` : ''}</div>` : ''}
        </div>
      </div>
    `;

    const actions = ugly
      ? [
          {
            label: '硬着头皮再看一眼',
            note: '你的胃在翻',
            cls: 'danger-btn',
            onClick: () => {
              closeModal();
              triggerUgly(gen);
            }
          },
          {
            label: '移开视线',
            note: '先离开这里',
            cls: 'ghost',
            onClick: () => closeModal()
          }
        ]
      : [
          {
            label: '养大它，再配一次',
            note: `下一代：第 ${Math.min(6, gen + 1)} 代`,
            cls: 'primary',
            onClick: () => {
              closeModal();
              setTimeout(() => raiseHybrid(h), 180);
            }
          },
          ...(gen === 1 ? [{
            label: '我也要加入这个家',
            note: '和它处对象',
            cls: 'primary',
            onClick: () => {
              closeModal();
              setTimeout(() => evolveHybrid(key), 220);
            }
          }] : []),
          {
            label: '不处对象，砍光它们',
            note: '拔刀',
            cls: 'danger-btn',
            onClick: () => {
              closeModal();
              triggerKillAll();
            }
          },
          {
            label: '先这样吧',
            cls: 'ghost',
            onClick: () => closeModal()
          }
        ];

    openModal({
      kicker: `HYBRID RESULT · ${gen > 1 ? `第 ${gen} 代` : '杂交结果'}`,
      title: ugly ? '它冲你笑了。' : (gen > 1 ? '这一代还像只鸡。' : '它看起来……还不错。'),
      body,
      actions,
      onMount: (b) => {
        const c = b.querySelector('#hybridPortrait');
        if (c) Art.drawHybrid(c, ugly ? 'toad' : (h.baseKey || key), h.mutation || 0);
      }
    });
  }

  function raiseHybrid(child) {
    if (state.phase !== 'play') return;
    state.busy = true;
    AudioEngine.sfx('grow');
    showToast(`第 ${child.gen} 代长大了。`);
    setTimeout(() => openGrownChild(child), 420);
  }

  function openGrownChild(child) {
    if (state.phase !== 'play') return;
    state.busy = false;
    const gen = child.gen;
    const lineage = lineageLabel(child.lineage);
    openModal({
      kicker: `THE NEXT GENERATION · 第 ${gen} 代`,
      title: '它长大了。',
      body: `
        <div class="result-stage">
          <div class="result-portrait">
            <span class="scan-label">${child.tag} · ADULT</span>
            <canvas id="grownPortrait" width="760" height="520"></canvas>
          </div>
          <div class="result-copy">
            <div class="result-name"><b>${child.name}</b><small>第 ${gen} 代 · 已成年</small></div>
            <div class="stat-row"><span>可爱度</span><div class="stat-track"><i style="width:${child.cute}%"></i></div><span>${child.cute}</span></div>
            <div class="stat-row"><span>丑度</span><div class="stat-track ugly"><i style="width:${child.ugly}%"></i></div><span>${child.ugly}</span></div>
            <p class="result-desc">它已经长到可以当家长了。它站在森林里，看着那些比它小的东西。${child.ugly >= 50 ? '它的影子不太对劲。' : '它看起来还算正常。'}</p>
            <p class="result-desc">族谱：${lineage}</p>
            <div class="result-warning">血脉越往下走，越不像鸡。你最好想清楚。</div>
          </div>
        </div>
      `,
      actions: [
        {
          label: '给它找个对象',
          note: '把血脉传下去',
          cls: 'primary',
          onClick: () => {
            closeModal();
            setTimeout(() => openChildMateMenu(child), 160);
          }
        },
        {
          label: '不处对象，砍光它们',
          note: '拔刀',
          cls: 'danger-btn',
          onClick: () => {
            closeModal();
            triggerKillAll();
          }
        },
        {
          label: '先这样吧',
          note: '停止繁育',
          cls: 'ghost',
          onClick: () => {
            closeModal();
            showToast('你决定不再配了。森林暂时安全。');
          }
        }
      ],
      onMount: (b) => {
        const c = b.querySelector('#grownPortrait');
        if (c) Art.drawHybrid(c, child.baseKey, child.mutation || 0);
      }
    });
  }

  function openChildMateMenu(child) {
    if (state.phase !== 'play') return;
    state.busy = false;
    openModal({
      kicker: 'THE FAMILY TREE GROWS',
      title: `给${child.name}找个对象`,
      body: `
        <p>它已经成年了。你把它领到森林相亲角。</p>
        <p>你可以让下一代的丑度继续往上叠。也可以现在就停手。</p>
        <div class="choice-grid" id="childMateGrid"></div>
      `,
      actions: [
        {
          label: '再想想',
          cls: 'ghost',
          onClick: () => {
            closeModal();
            setTimeout(() => openGrownChild(child), 160);
          }
        }
      ],
      onMount: (body) => {
        const grid = body.querySelector('#childMateGrid');
        if (!grid) return;
        ['rabbit', 'fox', 'toad'].forEach((key) => {
          const p = PARTNERS[key];
          const card = document.createElement('button');
          card.type = 'button';
          card.className = 'creature-card' + (key === 'toad' ? ' danger' : '');
          card.innerHTML = `
            <canvas width="300" height="250"></canvas>
            <span class="creature-meta">
              <b>${p.name}</b>
              <i>${p.risk}</i>
              <small>${p.note}</small>
            </span>
          `;
          card.addEventListener('click', () => {
            closeModal();
            setTimeout(() => breedChild(child, key), 180);
          });
          grid.appendChild(card);
          Art.drawPartner(card.querySelector('canvas'), key);
        });
      }
    });
  }

  function breedChild(child, partnerKey) {
    if (state.phase !== 'play') return;
    const next = buildNextChild(child, partnerKey);
    if (!next) return;
    state.busy = true;
    showToast(`又下了一窝蛋。第 ${next.gen} 代。`);
    AudioEngine.sfx('grow');
    setTimeout(() => {
      if (state.phase === 'play') openHybridResult(next.baseKey, next);
    }, 620);
  }

  function evolvePartner(key) {
    if (state.phase !== 'play') return;
    state.chickVisible = false;
    state.showKnife = false;
    AudioEngine.sfx('grow');
    playCinematic([
      ['第二天早上，雾气还没散。', ''],
      ['它站在一束光里，羽毛一片片落下。', ''],
      ['光散去以后，那里站着一个女孩。', 'gold'],
      ['她有一双不属于森林的眼睛。', 'small']
    ], () => openLoliScene(key, null));
  }

  function evolveHybrid(key) {
    if (state.phase !== 'play') return;
    state.chickVisible = false;
    state.showKnife = false;
    AudioEngine.sfx('grow');
    playCinematic([
      ['你抱住了那团毛茸茸的东西。', ''],
      ['它比你想的要轻。', ''],
      ['然后它开始发光。', 'gold'],
      ['你的手臂里，慢慢有了一个女孩的形状。', 'small']
    ], () => openLoliScene(key, HYBRIDS[key]));
  }

  function openLoliScene(key, hybrid) {
    state.phase = 'story';
    state.chickVisible = false;
    state.showKnife = false;
    hideHud();
    const p = PARTNERS[key];
    const name = hybrid ? hybrid.loli : p.loli;
    const variant = hybrid ? (key === 'toad' ? 'hybrid' : key) : p.variant;
    const origin = hybrid
      ? `${hybrid.name} 褪去最后一层不属于人的东西之后，你们之间多了一个不该存在的人。`
      : `${p.name} 褪去${p.molt}之后，你们之间多了一个不该存在的人。`;

    openModal({
      kicker: 'A STRANGE MIRACLE · 她醒了',
      title: '她抬起头。',
      className: 'loli-card',
      closable: false,
      body: `
        <div class="loli-stage">
          <div class="loli-art">
            <canvas id="loliPortrait" width="700" height="760"></canvas>
          </div>
          <div class="loli-copy">
            <p class="loli-name">${name}</p>
            <p class="loli-line">${origin}</p>
            <p class="loli-line">她穿着你的旧衬衫，头发里还留着一点森林的味道。她仰起脸，认真地等你给她一个称呼。</p>
            <div class="loli-prompt">你要她叫你什么？</div>
          </div>
        </div>
        <div class="loli-choices">
          <button class="loli-choice" type="button" data-choice="master"><span class="num">01</span><b>主人</b><small>让她成为你的所有物</small></button>
          <button class="loli-choice" type="button" data-choice="father"><span class="num">02</span><b>爸爸</b><small>给她一个家</small></button>
          <button class="loli-choice" type="button" data-choice="brother"><span class="num">03</span><b>哥哥</b><small>和她一起生活</small></button>
        </div>
      `,
      onMount: (body) => {
        const c = body.querySelector('#loliPortrait');
        if (c) Art.drawLoli(c, variant);
        body.querySelectorAll('[data-choice]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const choice = btn.getAttribute('data-choice');
            closeModal(true);
            triggerLoliChoice(choice, name);
          });
        });
      }
    });
  }

  function triggerLoliChoice(choice, name) {
    state.phase = 'story';
    state.chickVisible = false;
    state.showKnife = false;
    hideHud();
    if (choice === 'master') {
      AudioEngine.sfx('bad');
      playCinematic([
        [`你让她叫你“主人”。`, ''],
        ['她仰头看了你很久。', ''],
        ['“你长得太丑了。”', 'dark'],
        ['她转身走向那棵老树。', ''],
        ['绳子是早就挂好的。', 'small']
      ], () => showEnding('master'));
    } else if (choice === 'father') {
      AudioEngine.sfx('bad');
      playCinematic([
        [`你让她叫你“爸爸”。`, ''],
        ['她乖乖地点头，眼睛亮了一整夜。', ''],
        ['第二天，她捧出一个用羽毛和骨头拼成的小人。', 'dark'],
        ['“这是弟弟。”', ''],
        ['你连夜把她们丢进了森林最深处。', 'small']
      ], () => showEnding('father'));
    } else {
      AudioEngine.sfx('good');
      playCinematic([
        [`你让她叫你“哥哥”。`, ''],
        ['她笑了。森林里第一次有了回声。', 'gold'],
        ['你们盖了一间小木屋，种菜，养鸡。', ''],
        ['很多年后，黄昏的烟囱还会冒烟。', ''],
        ['她站在门口喊：哥哥，吃饭了。', 'gold']
      ], () => showEnding('brother'));
    }
  }

  function triggerUgly(generation) {
    if (state.phase !== 'play') return;
    state.busy = true;
    state.chickVisible = false;
    state.showKnife = false;
    AudioEngine.sfx('vomit');
    ui.vomit.classList.add('on');
    flash('green');
    shake(true);
    playCinematic([
      ['你抱起那只杂交动物。', ''],
      [generation && generation > 1 ? `第 ${generation} 代已经不能算动物了。` : '它有三只眼睛。它对你笑了。', 'dark'],
      ['你的胃先一步发出了尖叫。', ''],
      ['你吐了。然后，暴躁症接管了你的手。', 'dark'],
      ['你把他们全部打死了。', 'small']
    ], () => showEnding('ugly'));
  }

  function triggerKillAll() {
    if (state.phase !== 'play') return;
    state.busy = true;
    state.monster = true;
    state.showKnife = true;
    state.chickVisible = true;
    state.chickMood = 'idle';
    AudioEngine.sfx('slice');
    flash('red');
    shake(true);
    playCinematic([
      ['你拔出了刀。', 'dark'],
      ['你砍倒了森林里所有会动的东西。', ''],
      ['你把它们堆在小鸡面前。', ''],
      ['它低头吃了很久，然后抬起头。', ''],
      ['它的脖子变得很长，眼睛变得很多。', 'dark'],
      ['“你也想被喂吗？”', 'dark']
    ], () => showEnding('monster'));
  }

  function triggerSliced() {
    if (state.phase !== 'play') return;
    state.busy = true;
    state.phase = 'ending-transition';
    state.chickVisible = false;
    state.leg = true;
    state.showKnife = false;
    state.slashStart = performance.now();
    AudioEngine.sfx('slice');
    flash('red');
    shake(true);
    burstFeathers(40);
    addFloat('不要碰它。', Art.CHICK_X, Art.CHICK_Y - 320, '#ffb6a8', 32);
    hideDialogue();
    setTimeout(() => {
      showEnding('sliced');
    }, 1250);
  }

  function triggerPoison() {
    if (state.phase !== 'play' && state.phase !== 'ending-transition') return;
    state.phase = 'ending-transition';
    state.busy = true;
    state.showKnife = false;
    state.chickMood = 'dead';
    flash('violet');
    shake(true);
    hideHud();
    setTimeout(() => showEnding('poison'), 1800);
  }

  function triggerFly() {
    if (state.phase !== 'play') return;
    state.phase = 'ending-transition';
    state.busy = true;
    state.flying = true;
    state.flyStart = performance.now();
    state.chickMood = 'happy';
    state.showKnife = false;
    AudioEngine.sfx('fly');
    flash('');
    addFloat('它飞走了。', Art.CHICK_X, Art.CHICK_Y - 360, '#ffe8a8', 32);
    hideDialogue();
    setTimeout(hideHud, 1000);
    setTimeout(() => showEnding('fly'), 3900);
  }

  /* ─────────────────────────────────────────────────────────────
     cinematic + endings
     ───────────────────────────────────────────────────────────── */

  function playCinematic(lines, cb) {
    state.phase = 'cinematic';
    state.cinematicCb = cb;
    state.busy = true;
    closeModal(true);
    hideHud();
    hideDialogue();
    ui.cinematic.classList.remove('is-hidden');
    ui.cineLines.innerHTML = lines.map((l, i) => {
      const delay = (i * 0.52).toFixed(2);
      return `<p class="${l[1] || ''}" style="animation-delay:${delay}s">${l[0]}</p>`;
    }).join('');
    ui.cineNext.disabled = true;
    ui.cineNext.style.opacity = '0';
    const wait = Math.min(2200, 500 + lines.length * 420);
    setTimeout(() => {
      if (!state.cinematicCb) return;
      ui.cineNext.disabled = false;
      ui.cineNext.style.opacity = '1';
    }, wait);
  }

  function advanceCinematic() {
    if (!state.cinematicCb) return;
    const cb = state.cinematicCb;
    state.cinematicCb = null;
    ui.cineNext.disabled = true;
    ui.cinematic.classList.add('is-hidden');
    AudioEngine.sfx('ui');
    setTimeout(() => {
      if (cb) cb();
    }, 380);
  }

  function showEnding(id) {
    const e = ENDINGS[id];
    if (!e) return;
    state.ending = id;
    state.phase = 'ending';
    state.busy = true;
    state.showKnife = false;
    state.chickVisible = false;
    state.leg = false;
    state.flying = false;
    state.monster = false;
    hideHud();
    hideDialogue();
    closeModal(true);
    ui.cinematic.classList.add('is-hidden');
    ui.vomit.classList.remove('on');
    ui.dangerHint.classList.remove('show');
    ui.title.classList.add('is-hidden');
    ui.archive.classList.add('is-hidden');
    ui.fade.classList.remove('on');
    ui.flash.classList.remove('burst');

    ui.ending.classList.remove('is-hidden', 'good', 'true-end');
    if (e.tone === 'good') {
      ui.ending.classList.add('good');
      if (e.tag === 'TRUE END') ui.ending.classList.add('true-end');
    }
    ui.endingNumber.textContent = `结局 ${String(e.num).padStart(2, '0')} / ${String(ENDING_ORDER.length).padStart(2, '0')}`;
    ui.endingTag.textContent = e.tag;
    ui.endingTag.classList.toggle('good', e.tone === 'good');
    ui.endingTitle.textContent = e.title;
    ui.endingDesc.innerHTML = e.lines.join('<br>');
    Art.drawEndingArt(ui.endingArt, id);
    unlockEnding(id);
    updateProgress();
    AudioEngine.sfx(e.tone === 'good' ? 'good' : 'bad');
  }

  /* ─────────────────────────────────────────────────────────────
     archive
     ───────────────────────────────────────────────────────────── */

  function renderArchive() {
    const grid = ui.archiveGrid;
    grid.innerHTML = '';
    ENDING_ORDER.forEach((id) => {
      const e = ENDINGS[id];
      const has = unlocked.has(id);
      const item = document.createElement('div');
      item.className = 'archive-item ' + (has ? e.tone : 'locked');
      item.innerHTML = `
        <div class="num">ENDING ${String(e.num).padStart(2, '0')}</div>
        <h3>${has ? e.title : '？？？'}</h3>
        <p>${has ? e.short : '尚未抵达的结局。'}</p>
        ${has ? `<div class="tag">${e.tag}</div>` : ''}
      `;
      grid.appendChild(item);
    });
    updateProgress();
  }

  function openArchive() {
    if (archiveClearArmed) {
      archiveClearArmed = false;
      $('clearSave').textContent = '清除记录';
      if (archiveClearTimer) clearTimeout(archiveClearTimer);
    }
    renderArchive();
    ui.archive.classList.remove('is-hidden');
    AudioEngine.sfx('ui');
  }

  function closeArchive() {
    ui.archive.classList.add('is-hidden');
    AudioEngine.sfx('ui');
  }

  function clearSave() {
    const btn = $('clearSave');
    if (!archiveClearArmed) {
      archiveClearArmed = true;
      btn.textContent = '再点一次确认清除';
      if (archiveClearTimer) clearTimeout(archiveClearTimer);
      archiveClearTimer = setTimeout(() => {
        archiveClearArmed = false;
        btn.textContent = '清除记录';
      }, 3000);
      return;
    }
    unlocked.clear();
    saveUnlocked();
    archiveClearArmed = false;
    btn.textContent = '清除记录';
    renderArchive();
    showToast('记录已清除。');
  }

  /* ─────────────────────────────────────────────────────────────
     pointer / interaction
     ───────────────────────────────────────────────────────────── */

  function toWorld(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) / rect.width * W,
      y: (e.clientY - rect.top) / rect.height * H
    };
  }

  function ellipseHit(p, cx, cy, rx, ry) {
    const dx = (p.x - cx) / rx;
    const dy = (p.y - cy) / ry;
    return dx * dx + dy * dy <= 1;
  }

  function hitChick(p) {
    const geo = Art.getChickGeometry(state.weight);
    const s = 1.36;
    const body = ellipseHit(
      p,
      Art.CHICK_X,
      Art.CHICK_Y + geo.bodyCY * s,
      geo.rx * 1.05 * s,
      geo.ry * 1.02 * s
    );
    const head = ellipseHit(
      p,
      Art.CHICK_X + geo.headCX * s,
      Art.CHICK_Y + geo.headCY * s,
      geo.headR * 1.12 * s,
      geo.headR * 1.1 * s
    );
    return body || head;
  }

  function updateHover(p) {
    if (state.phase !== 'play' || state.modalOpen) {
      state.hoverChick = false;
      state.hoverGrass = null;
      ui.cursorHint.classList.remove('show');
      return;
    }
    state.hoverChick = hitChick(p);
    state.hoverGrass = state.hoverChick ? null : grassAt(p);
    ui.cursorHint.classList.toggle('show', state.hoverChick);
    if (state.hoverChick) {
      ui.cursorHint.textContent = '别碰它。';
      ui.cursorHint.style.left = (p.x / W * 100) + '%';
      ui.cursorHint.style.top = (p.y / H * 100) + '%';
    }
  }

  function onPointerMove(e) {
    if (e.pointerType !== 'touch') {
      const target = e.target;
      if (target && target.closest && target.closest('button')) {
        state.pointer.active = false;
        state.hoverChick = false;
        state.hoverGrass = null;
        ui.cursorHint.classList.remove('show');
        return;
      }
    }
    const p = toWorld(e);
    const dx = p.x - state.pointer.x;
    state.pointer.x = p.x;
    state.pointer.y = p.y;
    state.pointer.active = true;
    state.pointer.angle += (clamp(dx * 0.0018, -0.45, 0.45) - 0.28 - state.pointer.angle) * 0.18;
    updateHover(p);
    if (state.pointer.down && state.phase === 'play' && !state.modalOpen && !state.busy) {
      const c = grassAt(p);
      if (c && !c.cut) cutGrass(c);
    }
  }

  function onPointerDown(e) {
    if (state.phase !== 'play' || state.modalOpen || state.busy) return;
    if (e.pointerType === 'touch') {
      const target = e.target;
      if (target && target.closest && target.closest('button')) return;
    }
    const p = toWorld(e);
    state.pointer.x = p.x;
    state.pointer.y = p.y;
    state.pointer.down = true;
    state.pointer.active = true;
    updateHover(p);

    if (hitChick(p)) {
      triggerSliced();
      return;
    }

    const c = grassAt(p);
    if (c) {
      cutGrass(c);
    } else {
      state.slashStart = performance.now();
      AudioEngine.sfx('cut');
    }
    e.preventDefault();
  }

  function onPointerUp() {
    state.pointer.down = false;
  }

  /* ─────────────────────────────────────────────────────────────
     main loop
     ───────────────────────────────────────────────────────────── */

  function update(now) {
    state.phaseClock = now;
    const dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    updateParticles(dt);
    regrowGrass(now);

    if (now > state.nextBlink && now > state.startedAt + 1000) {
      state.blink = 1;
      state.blinkUntil = now + 170;
      state.nextBlink = now + 2600 + Math.random() * 3200;
    }
    if (state.blinkUntil && now > state.blinkUntil) {
      state.blink = 0;
      state.blinkUntil = 0;
    }

    if (state.slashStart) {
      const e = (now - state.slashStart) / 260;
      if (e >= 0 && e < 1) state.slash = e;
      else {
        state.slash = 0;
        state.slashStart = 0;
      }
    }

    if (state.phase !== 'play' && state.phase !== 'story') {
      state.pointer.active = false;
    }
  }

  function loop(now) {
    update(now);
    Art.drawScene(ctx, state, now);
    requestAnimationFrame(loop);
  }

  /* ─────────────────────────────────────────────────────────────
     boot
     ───────────────────────────────────────────────────────────── */

  function bind() {
    ui.startBtn.addEventListener('click', () => {
      AudioEngine.sfx('ui');
      startGame(false);
    });
    ui.feedSafe.addEventListener('click', () => feed('safe'));
    ui.feedPoison.addEventListener('click', () => feed('poison'));
    ui.fateBtn.addEventListener('click', () => {
      if (state.phase === 'play') openStageModal();
    });
    ui.soundBtn.addEventListener('click', () => AudioEngine.toggle());
    $('archiveBtn').addEventListener('click', openArchive);
    $('titleArchiveBtn').addEventListener('click', openArchive);
    $('endingArchiveBtn').addEventListener('click', openArchive);
    $('archiveClose').addEventListener('click', closeArchive);
    $('clearSave').addEventListener('click', clearSave);
    $('restartBtn').addEventListener('click', () => location.reload());
    ui.cineNext.addEventListener('click', advanceCinematic);
    $('modalClose').addEventListener('click', () => closeModal());

    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);
    ui.stage.addEventListener('pointerleave', () => {
      state.pointer.active = false;
      ui.cursorHint.classList.remove('show');
    });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (!ui.archive.classList.contains('is-hidden')) closeArchive();
        else if (state.modalOpen && !state.modalLocked) closeModal();
      }
      if (e.key === 'Enter' && !ui.cinematic.classList.contains('is-hidden') && !ui.cineNext.disabled) {
        advanceCinematic();
      }
    });
    window.addEventListener('resize', () => {
      // canvas uses fixed internal coordinates; nothing to recompute.
    });
  }

  function init() {
    Art.buildBackground();
    setupGrass();
    updateProgress();
    updateHUD();
    ui.hud.classList.add('is-hidden');
    requestAnimationFrame(loop);
    bind();
    runDebugScene();
  }

  /* ─────────────────────────────────────────────────────────────
     screenshot / debug scenes
     ───────────────────────────────────────────────────────────── */

  function runDebugScene() {
    const params = new URLSearchParams(location.search);
    const shot = params.get('shot');
    if (!shot) return;
    setTimeout(() => {
      if (shot === 'title') return;
      if (shot === 'ending') {
        const id = params.get('id') || 'brother';
        startGame(true);
        showEnding(ENDINGS[id] ? id : 'brother');
        return;
      }
      if (shot === 'archive') {
        openArchive();
        return;
      }
      startGame(true);
      state.weight = 52;
      state.safe = 4;
      state.poison = 2;
      state.stageModalSeen = true;
      updateHUD();
      if (shot === 'play') {
        showDialogue('草叶上有水。它歪头看你。刀在你手里。', 0);
        return;
      }
      if (shot === 'playlow') {
        state.weight = 30;
        state.safe = 2;
        state.poison = 1;
        updateHUD();
        return;
      }
      if (shot === 'modal') {
        openStageModal();
        return;
      }
      if (shot === 'mate') {
        openMateMenu();
        return;
      }
      if (shot === 'who') {
        openWhoModal(params.get('type') || 'rabbit');
        return;
      }
      if (shot === 'hybrid') {
        openHybridResult(params.get('type') || 'rabbit');
        return;
      }
      if (shot === 'grown' || shot === 'childmate' || shot === 'hybrid2' || shot === 'uglygen') {
        const type = params.get('type') || 'rabbit';
        const h = makeBaseChild(type);
        if (!h) return;
        h.gen = shot === 'uglygen' ? 5 : 2;
        h.mutation = h.gen - 1;
        h.name = generationName(HYBRIDS[h.baseKey], h.gen);
        h.tag = `GENERATION ${String(h.gen).padStart(2, '0')}`;
        h.cute = shot === 'uglygen' ? 16 : 58;
        h.ugly = shot === 'uglygen' ? 82 : 42;
        h.desc = mutationLine(h.gen, h.ugly, h.baseKey);
        if (shot === 'grown') openGrownChild(h);
        else if (shot === 'childmate') openChildMateMenu(h);
        else openHybridResult(type, h);
        return;
      }
      if (shot === 'loli') {
        state.chickVisible = false;
        openLoliScene(params.get('type') || 'chicken', null);
        return;
      }
    }, 240);
  }

  init();
})();

</script>
</body>
</html>
